.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:15px}

.phone::before{content:"";position:absolute;top:12px;left:50%;width:70px;height:6px;margin-left:-35px;background:#2c333d;border-radius:3px}
.screen{width:100%;height:100%;border-radius:22px;overflow:hidden;background:#fff}

</style>

<!-- The full prototype (pass-it-on.html), embedded so this file never depends on another file. -->
<script type="text/plain" id="app-src"><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="PASS IT ON: an offline school Book Bank prototype that supports the child without hiding the official textbook shortage.">
<title>PASS IT ON</title>
<style>
/* ==========================================================================
   PASS IT ON — single-file offline prototype
   Look: a school register page. Ruled lines, a red margin, ledger figures,
   ink-coloured borders, square corners. No floating cards.
   ========================================================================== */
:root{
  --page:#ebe4d3;
  --sheet:#fffdf7;
  --ink:#1b232c;
  --muted:#515b65;
  --rule:#ddd3bd;
  --rule-strong:#a89c82;
  --head:#f3eee1;
  --blue:#1d3f6e;
  --blue-tint:#e9eff7;
  --red:#a3261d;
  --red-tint:#fcf1ef;
  --green:#245733;
  --green-tint:#eef5ef;
  --amber:#865400;
  --amber-tint:#fdf5e2;
  --margin:#e3a39b;
  --focus:#f0a500;
  --r:4px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,"Noto Sans","Nirmala UI","Noto Sans Devanagari","Noto Sans Oriya","Noto Sans Odia",Mangal,Kalinga,sans-serif;
  font-size:17px;line-height:1.5;
}
html:lang(hi) body,html:lang(mr) body{font-family:"Nirmala UI","Noto Sans Devanagari",Mangal,"Segoe UI",system-ui,sans-serif;line-height:1.65}
html:lang(or) body{font-family:"Nirmala UI","Noto Sans Oriya","Noto Sans Odia",Kalinga,"Segoe UI",system-ui,sans-serif;line-height:1.7}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.3}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--blue);color:#fff;padding:10px 14px;text-decoration:none;font-weight:700}
.skip:focus{top:12px}
.code{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:.92em;white-space:nowrap}
.muted{color:var(--muted)}
.upper{letter-spacing:.06em}
html:lang(en) .upper{text-transform:uppercase;font-size:.86em}

/* ---------- Top bar ---------- */
.topbar{background:var(--sheet);border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:10}
.topbar__inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand__mark{width:34px;height:34px;flex:none}
.brand__name{font-weight:800;letter-spacing:.1em;color:var(--blue);font-size:19px;white-space:nowrap}
.tabs{display:inline-flex;border:1.5px solid var(--blue);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.tabs button{border:0;background:transparent;color:var(--blue);min-height:42px;padding:6px 18px;font-weight:700;font-size:16px;white-space:nowrap}
.tabs button+button{border-left:1.5px solid var(--blue)}
.tabs button:hover{background:var(--blue-tint)}
.tabs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.lang{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.lang select{min-height:44px;min-width:170px;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;padding:6px 10px;font-size:16px;font-weight:600;cursor:pointer}

/* ---------- The register page ---------- */
main{max-width:1100px;margin:22px auto 0;padding:0 16px;outline:none}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--rule-strong);padding:30px 34px 36px 72px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:5px;border-left:1.5px solid var(--margin);border-right:1.5px solid var(--margin)}
.kicker{font-size:15px;font-weight:700;color:var(--muted)}
.title h1{font-size:clamp(26px,3.6vw,38px);color:var(--blue);margin-top:6px;letter-spacing:-.005em}
.title h1 span{display:block}
.title h1 .h1b{color:var(--ink);font-weight:600}
.title .lead{margin-top:8px;color:var(--muted)}
.sec{margin-top:34px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.sec-h h2{font-size:20px}
.sec-h .aside{font-size:15px;font-weight:600}
.aside--local{color:var(--green)}
.aside--official{color:var(--red)}
.aside--wait{color:var(--amber)}
.sec-note{color:var(--muted);font-size:16px;margin:-4px 0 12px}

/* Stamped notice: a printed rule with a label block, like an office stamp */
.stamp{display:flex;align-items:stretch;border:2px solid var(--red);margin-top:18px;background:var(--red-tint)}
.stamp__label{flex:none;display:flex;align-items:center;background:var(--red);color:#fff;font-weight:800;padding:8px 14px;letter-spacing:.06em}
html:lang(en) .stamp__label{text-transform:uppercase;font-size:14px}
.stamp__text{padding:10px 14px;font-weight:650}
.stamp--blue{border-color:var(--blue);background:var(--blue-tint)}
.stamp--blue .stamp__label{background:var(--blue)}

/* ---------- Ledger of today's figures ---------- */
.ledger{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);background:#fff}
.ledger__cell{padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px}
.ledger__cell+.ledger__cell{border-left:1px solid var(--rule-strong)}
.ledger__cell--official{background:var(--red-tint)}
/* The double rule between the official figure and the school-only figures is the point of the page */
.ledger__cell--official+.ledger__cell{border-left:5px double var(--ink)}
.ledger__who{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.mk{width:11px;height:11px;flex:none;display:inline-block}
.ledger__label{font-size:17px;font-weight:700;margin-top:4px}
.ledger__num{font-size:58px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;align-self:flex-start;justify-self:end;padding:0 6px;margin-left:-6px}
.ledger__note{font-size:15px;color:var(--muted);border-top:1px dashed var(--rule-strong);padding-top:6px;margin-top:auto}
.c-red{color:var(--red)} .c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-blue{color:var(--blue)}
.bg-red{background:var(--red)} .bg-green{background:var(--green)} .bg-amber{background:var(--amber)}
.ledger__cell.is-changed .ledger__num{animation:ink 1.6s ease-out}
@keyframes ink{0%{background:#ffe7a3}100%{background:transparent}}

/* ---------- Four primary actions: solid, pressable buttons ---------- */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;background:#fff;border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:0 4px 0 var(--ink);min-height:100px;transition:transform .08s,box-shadow .08s}
.action:hover{background:var(--blue-tint)}
.action:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.action__icon{font-size:28px;line-height:1.2;flex:none}
.action__title{display:block;font-size:19px;font-weight:800;color:var(--blue);line-height:1.3}
.action__sub{display:block;font-size:15px;color:var(--muted);margin-top:3px}
.action--govt{border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.action--govt:hover{background:var(--red-tint)}
.action--govt:active{box-shadow:0 1px 0 var(--red)}
.action--govt .action__title{color:var(--red)}

.foot-note{font-size:15px;color:var(--muted);margin-top:10px}

/* ---------- Register tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
.reg{border:1.5px solid var(--ink);background:#fff}
.reg th,.reg td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:middle}
.reg thead th{background:var(--head);border-bottom:2px solid var(--ink);font-size:15px;font-weight:700}
html:lang(en) .reg thead th{text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.reg .sno{width:52px;color:var(--muted);border-right:1.5px solid var(--margin);text-align:center}
.reg td.n,.reg th.n{text-align:right;font-variant-numeric:tabular-nums}
.reg tfoot th,.reg tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:800;background:var(--head)}
.reg tbody tr:last-child th,.reg tbody tr:last-child td{border-bottom:0}
.st{font-weight:700;display:inline-flex;gap:6px;align-items:baseline}
.st--wait{color:var(--amber)} .st--temp{color:var(--green)} .st--govt{color:var(--blue)} .st--due{color:var(--amber)}
.flag{font-weight:800;font-variant-numeric:tabular-nums}
#crc-table tbody th{white-space:nowrap}

/* ---------- School-only records ---------- */
.records{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.records h3{font-size:17px;margin-bottom:8px}
.log time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--r);border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:16px;text-align:center}
.btn:hover{background:var(--blue-tint)}
.btn--primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn--primary:hover{background:#15315a}
.btn--danger{background:var(--red);border-color:var(--red);color:#fff}
.btn--danger:hover{background:#86200f}
.btn--link{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn--link:hover{background:transparent;color:var(--ink)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- CRC ---------- */
.demand{display:block;border:1.5px solid var(--blue);background:var(--blue-tint);padding:14px 18px}
.demand__num{font-size:48px;font-weight:800;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.demand__text{font-size:19px;font-weight:700}

/* ---------- Footer ---------- */
.foot{max-width:1100px;margin:0 auto;padding:12px 16px 28px;color:var(--muted);font-size:15px;display:flex;gap:4px 16px;flex-wrap:wrap;justify-content:space-between}
.foot strong{color:var(--ink)}

/* ---------- Dialog ---------- */
dialog{border:1.5px solid var(--ink);padding:0;border-radius:6px;width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--sheet);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,26,34,.6)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg__head{padding:16px 22px 10px;border-bottom:2px solid var(--ink)}
.dlg__head h2{font-size:22px;color:var(--blue)}
.dlg__body{padding:16px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg__foot{padding:12px 22px 16px;border-top:1px solid var(--rule-strong);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.q{font-size:19px;font-weight:700}
.hint{color:var(--muted);font-size:16px}
.note{border-left:5px solid;padding:9px 12px;font-size:16px}
.note strong{font-weight:750}
.note--good{border-color:var(--green);background:var(--green-tint)}
.note--rule{border-color:var(--red);background:var(--red-tint)}
.note--wait{border-color:var(--amber);background:var(--amber-tint)}
.note--lock{border-color:var(--blue);background:var(--blue-tint)}
.note--plain{border-color:var(--rule-strong);background:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:80px;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;font-size:18px;font-weight:750;padding:12px;box-shadow:0 4px 0 var(--ink)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice--yes{color:var(--green)}
.choice--yes:hover{background:var(--green-tint)}
.choice--no{color:var(--red)}
.choice--no:hover{background:var(--red-tint)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:4px}
.pick{list-style:none;margin:8px 0 0;padding:0;border:1.5px solid var(--ink);background:#fff}
.pick li+li{border-top:1px solid var(--rule)}
.pick label{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;cursor:pointer}
.pick label:hover{background:var(--blue-tint)}
.pick label:has(input:checked){background:var(--blue-tint);box-shadow:inset 5px 0 0 var(--blue)}
.pick input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:0}
.pick .who{font-weight:750;font-size:18px}
.pick .when{margin-left:auto;color:var(--muted);white-space:nowrap}
.rows{list-style:none;margin:0;padding:0;border:1.5px solid var(--ink);background:#fff}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;flex-wrap:wrap}
.rows li+li{border-top:1px solid var(--rule)}
.rows li.due{background:var(--amber-tint);box-shadow:inset 5px 0 0 var(--amber)}
.rows .who{font-weight:750;font-size:18px}
.rows .meta{display:block;font-size:15px;color:var(--muted)}
.rows .btn{margin-left:auto}
.copyline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:1.5px dashed var(--green);background:var(--green-tint);padding:10px 14px;flex-wrap:wrap}
.copyline .code{font-size:20px;font-weight:800;color:var(--green)}
.stepper{display:flex;align-items:stretch;gap:8px;max-width:320px}
.stepper button{width:60px;min-height:60px;font-size:28px;font-weight:800;border-radius:var(--r);border:1.5px solid var(--ink);background:#fff}
.stepper button:hover{background:var(--blue-tint)}
.stepper input{flex:1;min-width:0;text-align:center;font-size:30px;font-weight:800;border:2px solid var(--blue);border-radius:var(--r);background:#fff;font-variant-numeric:tabular-nums}
.error{color:var(--red);font-weight:700}
.changes{width:100%;border:1.5px solid var(--ink);background:#fff}
.changes th,.changes td{padding:9px 12px;border-bottom:1px solid var(--rule);font-size:16px}
.changes tr:last-child th,.changes tr:last-child td{border-bottom:0}
.changes th{font-weight:600;text-align:left}
.changes td{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.changes td strong{font-size:20px}
.changes .official{background:var(--red-tint)}
.changes .official th{color:var(--red);font-weight:700}
.changes .arrow{color:var(--muted);padding:0 4px}
.changes .same{font-size:14px;color:var(--muted);font-style:italic;margin-left:6px}
.namelist{margin:6px 0 0;padding-left:20px}

/* ---------- Class & subject bar, forms ---------- */
/* Class, then subject: two rows of big buttons, the way a teacher thinks about a register */
.picker{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;padding-bottom:16px;margin-bottom:22px;border-bottom:1px dashed var(--rule-strong)}
.picker__label{font-weight:700;font-size:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:46px;padding:6px 14px;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.chip:hover{background:var(--blue-tint)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{font-size:13px;font-weight:700;padding:1px 7px;border-radius:3px;background:var(--red-tint);color:var(--red);white-space:nowrap}
.chip small.ok{background:var(--green-tint);color:var(--green)}
.chip--add{border-style:dashed;color:var(--blue);font-weight:600}
.why{margin-top:12px;font-size:16px;color:var(--muted);border-left:4px solid var(--rule-strong);padding:4px 0 4px 12px}
.why strong{color:var(--ink)}
.bookpick{border:1.5px solid var(--ink);background:#fff}
.bookpick__row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:10px 12px}
.bookpick__row+.bookpick__row{border-top:1px solid var(--rule)}
.bookpick__cls{font-weight:800}
.btn--small{min-height:44px;padding:8px 14px;font-size:15px}
.listbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin:0 0 12px}
.namecount{font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:700}
.field input,.field select,.field textarea{min-height:46px;width:100%;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;padding:8px 10px;font-size:17px}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{list-style:none;margin:8px 0 0;padding:0;border:1.5px solid var(--ink);background:#fff;max-height:250px;overflow:auto}
.checks li+li{border-top:1px solid var(--rule)}
.checks label{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 14px;cursor:pointer}
.checks label:has(input:checked){background:var(--blue-tint)}
.checks input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:0}
.checks .who{font-weight:750}
.checks .tag{font-size:14px;color:var(--green);font-weight:700;white-space:nowrap}
.checks .when{margin-left:auto;color:var(--muted);white-space:nowrap}
.demand-list{margin:0;padding-left:20px}
.demand-list li{margin:4px 0;font-size:17px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.picker{grid-template-columns:1fr;gap:6px}.bookpick__row{grid-template-columns:1fr;gap:6px}}

/* ---------- Print documents (hidden on screen) ---------- */
#print-root{display:none}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .actions{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .ledger{grid-template-columns:1fr}
  .ledger__cell{display:grid;grid-template-columns:1fr auto;grid-template-areas:"who num" "label num" "note note";column-gap:14px;align-items:center}
  .ledger__cell+.ledger__cell{border-left:0;border-top:1px solid var(--rule-strong)}
  .ledger__cell--official+.ledger__cell{border-left:0;border-top:5px double var(--ink)}
  .ledger__who{grid-area:who}
  .ledger__label{grid-area:label}
  .ledger__num{grid-area:num;font-size:48px}
  .ledger__note{grid-area:note;margin-top:6px}
  .records{grid-template-columns:1fr}
}
@media (max-width:700px){
  .topbar{position:static}
  .topbar__inner{padding:10px 12px}
  .tabs{width:100%}
  .tabs button{flex:1 1 0;padding:6px 8px}
  .lang{width:100%}
  .lang select{flex:1}
  main{margin-top:12px;padding:0 8px}
  .sheet{padding:20px 14px 26px 36px}
  .sheet::before{left:14px;width:4px}
  .sec{margin-top:28px}
  .foot{padding:12px 12px 24px}
}
@media (max-width:640px){
  .actions{grid-template-columns:1fr}
  .action{min-height:0;flex-direction:row;align-items:center;gap:14px}
  /* Tables become ruled entries so nothing scrolls sideways */
  .stacked thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .stacked,.stacked tbody,.stacked tfoot,.stacked tr,.stacked td,.stacked th{display:block;width:100%}
  .stacked tr{padding:10px 12px;border-bottom:1px solid var(--rule)}
  .stacked tbody tr:last-child{border-bottom:0}
  .stacked td,.stacked th{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;border:0;text-align:right;background:none}
  .stacked td::before,.stacked th::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;font-size:15px}
  .stacked .cell-title{font-size:18px;font-weight:800;text-align:left}
  .stacked .cell-title::before,.stacked .sno::before{content:none}
  .stacked .cell-empty,.stacked .sno{display:none}
  .stacked tfoot tr{background:var(--head);border-top:2px solid var(--ink)}
  .compact tr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .compact th,.compact td{display:block;width:auto;padding:0}
  .compact td::before{content:none}
  .compact .cell-title{font-size:16px}
  .waitlist tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
  .waitlist th,.waitlist td{display:block;width:auto;padding:0;text-align:left}
  .waitlist td::before{content:none}
  .waitlist td.n{text-align:right;color:var(--muted)}
  .waitlist td:last-child{text-align:right}
  .choices{grid-template-columns:1fr}
  .dlg__head,.dlg__body,.dlg__foot{padding-left:16px;padding-right:16px}
  .dlg__foot .btn{flex:1 1 auto}
  .demand{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- Print ---------- */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:11pt;line-height:1.45;color:#000}
  .screen,.skip,dialog,#live,noscript{display:none!important}
  #print-root{display:block!important}
  .doc h1{font-size:18pt;margin:0 0 2mm}
  .doc .sub{font-size:10.5pt;margin-bottom:5mm}
  .doc .meta{display:flex;flex-wrap:wrap;gap:3mm 10mm;margin:0 0 5mm;font-size:11pt}
  .doc table{width:100%;border-collapse:collapse;margin:0 0 5mm}
  .doc tbody td:first-child{white-space:nowrap}
  .doc th,.doc td{border:1px solid #000;padding:2.4mm 2.6mm;font-size:10.5pt;text-align:left;background:none;color:#000}
  .doc thead th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:700}
  .doc td.n,.doc th.n{text-align:right}
  .doc .protect{border:2.5px solid #000;padding:4mm 5mm;font-size:12pt;font-weight:700;margin:0 0 5mm}
  .doc .rules{border:1.5px solid #000;padding:3mm 5mm;margin:0 0 5mm}
  .doc .rules ol{margin:1mm 0 0;padding-left:6mm}
  .doc .rules li{font-weight:600;margin:1mm 0}
  .doc .signs{display:flex;gap:12mm;margin-top:14mm}
  .doc .signs div{flex:1;border-top:1px solid #000;padding-top:1.5mm;font-size:10pt}
  .doc .foot-note{font-size:9pt;color:#333;margin-top:6mm}
  .doc .blank td{height:9mm}
}

      lent to a Class 6 Science child).
   ========================================================================== */
const SCHOOL = Object.freeze({ name:"Govt School A", cluster:"Demo Cluster, Demo Block" });
const SUBJECTS = Object.freeze([
  { key:"science", code:"SCI" }, { key:"maths", code:"MAT" }, { key:"english", code:"ENG" },
  { key:"hindi", code:"HIN" }, { key:"socialScience", code:"SST" }, { key:"evs", code:"EVS" },
  { key:"odia", code:"ODI" }, { key:"marathi", code:"MAR" }, { key:"sanskrit", code:"SAN" }
]);
const CLASSES = Array.from({ length:12 }, (_, i) => String(i + 1));
// Other schools' rows exist only as official figures — a CRC never receives Book Bank data from any school.
const OTHER_SCHOOLS = Object.freeze([
  { school:"Govt School B", cls:"6", subjectKey:"science", entitled:42, received:42, longest:0 },
  { school:"Govt School C", cls:"9", subjectKey:"maths",   entitled:47, received:43, longest:18 }
]);
const DATA_KEY = "passiton.v3.data";
const PREFS_KEY = "passiton.v3.prefs";
const MAX_NAME = 60;

const DAY_MS = 864e5;
const toISODate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function today(){ const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function isoDaysAgo(n){ const d = today(); d.setDate(d.getDate() - n); return toISODate(d); }
function daysSince(iso){
  const [y, m, d] = iso.split("-").map(Number);
  return Math.max(0, Math.round((today() - new Date(y, m - 1, d)) / DAY_MS));
}
// Most state-board sessions start in June; the teacher can change the date.
function sessionStart(){ const now = new Date(); return `${now.getMonth() >= 5 ? now.getFullYear() : now.getFullYear() - 1}-06-01`; }

const subjectCode = key => (SUBJECTS.find(s => s.key === key) || { code:"GEN" }).code;
const subjectIndex = key => SUBJECTS.findIndex(s => s.key === key);
const copyCode = (g, n) => `BB-${g.cls}-${subjectCode(g.subjectKey)}-${String(n).padStart(3, "0")}`;

function newGroup(d, { cls, subjectKey, entitled, govtReceived, lastYearOrder = null }){
  const g = { id:"g" + d.nextId++, cls, subjectKey, entitled, govtReceived, lastYearOrder, students:[], copies:[], nextCopy:1, log:[] };
  d.groups.push(g);
  return g;
}
function addStudent(d, g, name, since){ g.students.push({ id:"s" + d.nextId++, name, since, govt:false }); }
function addCopy(g){ const code = copyCode(g, g.nextCopy++); g.copies.push({ code, holder:null }); return code; }

function freshData(){
  const d = { v:3, nextId:1, groups:[] };
  // The mandatory demo case from the spec.
  const g6 = newGroup(d, { cls:"6", subjectKey:"science", entitled:60, govtReceived:50, lastYearOrder:30 });
  [["Asha",31],["Ravi",26],["Meena",22],["Salim",18],["Pooja",16],["Bikash",14],["Rani",12],["Imran",9],["Sunita",7],["Gopal",5]]
    .forEach(([name, days]) => addStudent(d, g6, name, isoDaysAgo(days)));
  for (let i = 0; i < 7; i++) addCopy(g6);
  const g7 = newGroup(d, { cls:"7", subjectKey:"maths", entitled:52, govtReceived:48, lastYearOrder:50 });
  [["Arjun",20],["Kavya",15],["Deepak",11],["Fatima",6]].forEach(([name, days]) => addStudent(d, g7, name, isoDaysAgo(days)));
  for (let i = 0; i < 3; i++) addCopy(g7);
  const g8 = newGroup(d, { cls:"8", subjectKey:"english", entitled:45, govtReceived:45, lastYearOrder:45 });
  for (let i = 0; i < 2; i++) addCopy(g8);
  return d;
}

/* ==========================================================================
   3. Storage (localStorage, guarded — the app still runs if it is blocked)
   ========================================================================== */
const store = {
  get(key){ try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage blocked: keep working in memory */ } }
};
function isValidData(d){
  return !!d && d.v === 3 && Number.isInteger(d.nextId) && Array.isArray(d.groups) && d.groups.length > 0 &&
    d.groups.every(g => Number.isFinite(g.entitled) && Number.isFinite(g.govtReceived) && Array.isArray(g.students) &&
      Array.isArray(g.copies) && Array.isArray(g.log) && Number.isInteger(g.nextCopy));
}
function loadPrefs(){
  const p = store.get(PREFS_KEY) || {};
  return { lang: I18N[p.lang] ? p.lang : "en", role: p.role === "crc" ? "crc" : "school", group: typeof p.group === "string" ? p.group : null };
}
let prefs = loadPrefs();
let data = (() => { const d = store.get(DATA_KEY); return isValidData(d) ? d : freshData(); })();
const savePrefs = () => store.set(PREFS_KEY, prefs);
const saveData = () => store.set(DATA_KEY, data);

const sortedGroups = () => [...data.groups].sort((a, b) => Number(a.cls) - Number(b.cls) || subjectIndex(a.subjectKey) - subjectIndex(b.subjectKey));
function currentGroup(){ return data.groups.find(g => g.id === prefs.group) || sortedGroups()[0]; }

/* ==========================================================================
   4. Calculations
   ========================================================================== */

// OFFICIAL figures for one class + subject. Used by the school's official figure, the CRC view
// and the printed statement. Reads ONLY enrolment, official receipts and waiting dates — never g.copies.
function officialRowFor(g){
  const pending = Math.max(0, g.entitled - g.govtReceived);
  const waiting = g.students.filter(s => !s.govt).map(s => daysSince(s.since));
  return {
    school: SCHOOL.name, cls: g.cls, subjectKey: g.subjectKey,
    entitled: g.entitled, received: g.govtReceived, pending, lastYearOrder: g.lastYearOrder,
    longest: pending === 0 ? 0 : (waiting.length ? Math.max(...waiting) : null)   // null = names not listed yet
  };
}
const ownRows = () => sortedGroups().map(officialRowFor);
const officialRows = () => [...ownRows(), ...OTHER_SCHOOLS.map(r => ({ ...r, pending: Math.max(0, r.entitled - r.received) }))];

// SCHOOL-LOCAL learning-continuity figures. Never passed to the CRC view or the printed statement.
const studentById = (g, id) => g.students.find(s => s.id === id);
const copyOf = (g, s) => g.copies.find(c => c.holder === s.id) || null;
function localFigures(g){
  const lent = g.copies.filter(c => c.holder);
  // A temporary copy only fills today's gap while the child is still owed their government book.
  const covering = lent.filter(c => !studentById(g, c.holder).govt).length;
  return {
    available: g.copies.length - lent.length, lent: lent.length, covering,
    noPhysical: Math.max(0, officialRowFor(g).pending - covering)
  };
}
function snapshot(g){
  const o = officialRowFor(g), l = localFigures(g);
  return { pending:o.pending, received:o.received, available:l.available, noPhysical:l.noPhysical };
}
const namedWaiting = g => g.students.filter(s => !s.govt).length;
const byLongestWait = (a, b) => a.since.localeCompare(b.since) || a.name.localeCompare(b.name);

/* ==========================================================================
   5. Helpers
   ========================================================================== */
const $ = sel => document.querySelector(sel);
const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = v => String(v).replace(/[&<>"']/g, ch => ESC[ch]);
function fill(str, params){ return str.replace(/\{(\w+)\}/g, (m, k) => (params && k in params) ? params[k] : m); }
function t(key, params){ return fill((I18N[prefs.lang] && I18N[prefs.lang][key]) ?? I18N.en[key] ?? key, params); }
/* HTML-safe translation; parameters are escaped and emphasised. */
function th(key, params){
  const safe = {};
  for (const k in (params || {})) safe[k] = "\u0000" + k + "\u0001";
  let out = esc(t(key, safe));
  for (const k in (params || {})) out = out.split("\u0000" + k + "\u0001").join("<strong>" + esc(params[k]) + "</strong>");
  return out;
}
const days = n => n === null ? "—" : t("days", { n });
const subject = key => t(key);
const groupLabel = g => `${t("classN", { n:g.cls })} · ${subject(g.subjectKey)}`;
function monthName(){
  try { return new Intl.DateTimeFormat(localeOf(prefs.lang), { month:"long", year:"numeric" }).format(new Date()); }
  catch { return new Intl.DateTimeFormat("en-IN", { month:"long", year:"numeric" }).format(new Date()); }
}
function timeLabel(iso){
  try { return new Intl.DateTimeFormat(localeOf(prefs.lang), { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }).format(new Date(iso)); }
  catch { return ""; }
}
function announce(msg){ const live = $("#live"); live.textContent = ""; setTimeout(() => { live.textContent = msg; }, 30); }
function addLog(g, k, p){ g.log.unshift({ k, p, at:new Date().toISOString() }); g.log.length = Math.min(g.log.length, 40); }

/* ==========================================================================
   6. Rendering
   ========================================================================== */
const ui = { modal:null, returnFocus:null, shown:null };
const langSelect = $("#lang-select");
langSelect.innerHTML = LANGS.map(l => `<option value="${esc(l.code)}" lang="${esc(l.code)}">${esc(l.name)}</option>`).join("");

function render(){
  document.documentElement.lang = prefs.lang;
  document.title = "PASS IT ON · " + (prefs.role === "crc" ? t("crcHeading") : t("school"));
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-action=set-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === prefs.role)));
  langSelect.value = prefs.lang;
  // Only the active view exists in the DOM, so the CRC page never even contains hidden Book Bank data.
  $("#view").innerHTML = prefs.role === "crc" ? crcView() : schoolView();
  if (prefs.role === "school") markChangedFigures();
  if (ui.modal) renderModal();
}

function markChangedFigures(){
  const g = currentGroup();
  const now = { group:g.id, ...snapshot(g) };
  if (ui.shown && ui.shown.group === now.group) {
    ["pending", "available", "noPhysical"].forEach(key => {
      if (ui.shown[key] !== now[key]) document.querySelector(`[data-stat="${key}"]`)?.classList.add("is-changed");
    });
  }
  ui.shown = now;
}

const sectionHead = (id, title, aside = "", asideClass = "") =>
  `<div class="sec-h"><h2 id="${id}">${esc(title)}</h2>${aside ? `<span class="aside ${asideClass}">${esc(aside)}</span>` : ""}</div>`;

const classesInUse = () => [...new Set(sortedGroups().map(g => g.cls))];
function pendingBadge(pending){
  return pending ? `<small>${esc(t("pendingN", { n:pending }))}</small>` : `<small class="ok">✓ ${esc(t("complete"))}</small>`;
}
function picker(g){
  const classChips = classesInUse().map(cls => {
    const pending = data.groups.filter(x => x.cls === cls).reduce((a, x) => a + officialRowFor(x).pending, 0);
    return `<button type="button" class="chip" data-action="pick-class" data-cls="${esc(cls)}" aria-pressed="${cls === g.cls}">${esc(t("classN", { n:cls }))}${pendingBadge(pending)}</button>`;
  }).join("");
  const subjectChips = sortedGroups().filter(x => x.cls === g.cls).map(x =>
    `<button type="button" class="chip" data-action="pick-group" data-id="${esc(x.id)}" aria-pressed="${x.id === g.id}">${esc(subject(x.subjectKey))}${pendingBadge(officialRowFor(x).pending)}</button>`).join("");
  return `<div class="picker">
    <span class="picker__label" id="pick-class-l">${esc(t("classCol"))}</span>
    <div class="chips" role="group" aria-labelledby="pick-class-l">${classChips}
      <button type="button" class="chip chip--add" data-action="open-group-new" data-scope="class">+ ${esc(t("addClass"))}</button></div>
    <span class="picker__label" id="pick-subj-l">${esc(t("subjectCol"))}</span>
    <div class="chips" role="group" aria-labelledby="pick-subj-l">${subjectChips}
      <button type="button" class="chip chip--add" data-action="open-group-new" data-scope="subject">+ ${esc(t("addSubject"))}</button>
      <button type="button" class="btn btn--small btn--link" data-action="open-group-edit">${esc(t("editGroup"))}</button></div>
  </div>`;
}

  return `
  <div class="sheet">
    ${picker(g)}

      <p class="kicker">${esc(SCHOOL.name)} · ${esc(groupLabel(g))}</p>

    <section class="sec" aria-labelledby="counts-h">

          <p class="ledger__num c-green" id="stat-available">${l.available}</p>
          <p class="ledger__note">${esc(t("cardBankHelp", { n:l.lent }))}</p>
        </div>
        <div class="ledger__cell" data-stat="noPhysical">
          <span class="ledger__who c-amber"><span class="mk bg-amber" aria-hidden="true"></span>${esc(t("cardGapTag"))}</span>
          <h3 class="ledger__label">${esc(t("cardGap"))}</h3>
          <p class="ledger__num c-amber" id="stat-nophysical">${l.noPhysical}</p>
          <p class="ledger__note">${esc(t("cardGapHelp"))}</p>
        </div>
      </div>
      <p class="why"><strong>${esc(t("whyQ"))}</strong> ${esc(t("whyA"))}</p>

    <section class="sec" aria-labelledby="actions-h">
      ${sectionHead("actions-h", t("actionsHeading"))}
      <div class="actions">

        ${actionButton("open-give", "📖➡️", "giveBook", "giveBookSub")}
        ${actionButton("open-return", "📖↩️", "returnBook", "returnBookSub")}
        ${actionButton("open-govt", "📦✓", "govArrived", "govArrivedSub", "action--govt")}
      </div>
    </section>

    <section class="sec" aria-labelledby="wait-h">
      ${sectionHead("wait-h", `${t("waitHeading")} · ${groupLabel(g)}`, t("waitCount", { n:named }), "aside--wait")}
      <p class="sec-note">${esc(t("waitNote"))}</p>
      <div class="listbar">
        <span class="namecount">${esc(t("namesCount", { named, pending:o.pending }))}</span>

      ${missing > 0 ? note("wait", esc(t("namesMissing", { n:missing }))) : ""}

        <button type="button" class="btn" data-action="print-sheet">${esc(t("printSheet"))}</button>

}

function actionButton(action, icon, titleKey, subKey, extra = ""){
  return `<button type="button" class="action ${extra}" data-action="${action}">
    <span class="action__icon" aria-hidden="true">${icon}</span>
    <span><span class="action__title">${esc(t(titleKey))}</span><span class="action__sub">${esc(t(subKey))}</span></span>
  </button>`;
}

// Status is shown with a distinct symbol AND words, never colour alone.
function statusMark(g, s){
  const copy = copyOf(g, s);
  if (s.govt && copy) return `<span class="st st--due"><span aria-hidden="true">↩</span>${esc(t("stReturn"))}</span>`;
  if (s.govt)         return `<span class="st st--govt"><span aria-hidden="true">✓</span>${esc(t("stGovt"))}</span>`;
  if (copy)           return `<span class="st st--temp"><span aria-hidden="true">◐</span>${esc(t("stTemp"))}</span>`;
  return `<span class="st st--wait"><span aria-hidden="true">○</span>${esc(t("stWaiting"))}</span>`;
}

function waitingTable(g){
  const rows = [...g.students].sort(byLongestWait).map((s, i) => {
    const copy = copyOf(g, s);
    return `<tr>
      <td class="sno">${i + 1}</td>
      <th scope="row" class="cell-title" data-label="${esc(t("student"))}">${esc(s.name)}</th>
      <td class="n" data-label="${esc(t("daysWaiting"))}">${s.govt ? "—" : esc(days(daysSince(s.since)))}</td>
      <td data-label="${esc(t("status"))}">${statusMark(g, s)}</td>
      <td data-label="${esc(t("tempCopy"))}">${copy ? `<span class="code">${esc(copy.code)}</span>` : `<span class="muted">${esc(t("none"))}</span>`}</td>
    </tr>`;
  }).join("");
  return `<table class="reg stacked waitlist" aria-labelledby="wait-h">
    <thead><tr><th scope="col" class="sno">${esc(t("sNo"))}</th><th scope="col">${esc(t("student"))}</th><th scope="col" class="n">${esc(t("daysWaiting"))}</th><th scope="col">${esc(t("status"))}</th><th scope="col">${esc(t("tempCopy"))}</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function shelfTable(g){
  const rows = [...g.copies].sort((a, b) => a.code.localeCompare(b.code)).map(c => {
    let where = `<span class="st st--temp"><span aria-hidden="true">▣</span>${esc(t("onShelf"))}</span>`;
    if (c.holder) {
      const s = studentById(g, c.holder);
      where = s.govt
        ? `<span class="st st--due"><span aria-hidden="true">↩</span>${esc(t("returnDue", { name:s.name }))}</span>`
        : `<span class="st st--govt"><span aria-hidden="true">→</span>${esc(t("withChild", { name:s.name }))}</span>`;
    }
    return `<tr><th scope="row" class="cell-title code" data-label="${esc(t("shCopy"))}">${esc(c.code)}</th><td data-label="${esc(t("whereCol"))}">${where}</td></tr>`;
  }).join("");
  return `<table class="reg stacked compact" aria-label="${esc(t("shelfHeading"))}">
    <thead><tr><th scope="col">${esc(t("shCopy"))}</th><th scope="col">${esc(t("whereCol"))}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

const LOG_KEYS = { added:"logAdded", rejected:"logRejected", issued:"logIssued", returned:"logReturned", govt:"logGovt", listed:"logListed" };
function logTable(g){
  if (!g.log.length) return `<p class="muted">${esc(t("logEmpty"))}</p>`;
  const rows = g.log.slice(0, 8).map(e =>
    `<tr><td data-label="${esc(t("whenCol"))}"><time datetime="${esc(e.at)}">${esc(timeLabel(e.at))}</time></td><td data-label="${esc(t("entryCol"))}">${esc(t(LOG_KEYS[e.k] || e.k, e.p))}</td></tr>`).join("");
  return `<table class="reg stacked compact log" aria-label="${esc(t("logHeading"))}">
    <thead><tr><th scope="col">${esc(t("whenCol"))}</th><th scope="col">${esc(t("entryCol"))}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function demandLines(){
  return ownRows().map(r => {
    const label = `${t("classN", { n:r.cls })} · ${subject(r.subjectKey)}`;
    const text = r.lastYearOrder != null && r.lastYearOrder !== r.entitled
      ? t("demandText", { n:r.entitled, old:r.lastYearOrder })
      : t("demandTextNoOld", { n:r.entitled });
    return { label, text };
  });
}

/* CRC / Block view — built exclusively from officialRows() and demandLines(). */
function crcView(){
  const rows = officialRows();
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  const body = rows.map((r, i) => `<tr>
      <td class="sno">${i + 1}</td>
      <th scope="row" class="cell-title" data-label="${esc(t("schoolCol"))}">${esc(r.school)}</th>
      <td class="n" data-label="${esc(t("classCol"))}">${esc(r.cls)}</td>
      <td data-label="${esc(t("subjectCol"))}">${esc(subject(r.subjectKey))}</td>
      <td class="n" data-label="${esc(t("entitledCol"))}">${r.entitled}</td>
      <td class="n" data-label="${esc(t("receivedCol"))}">${r.received}</td>
      <td class="n" data-label="${esc(t("pendingCol"))}">${r.pending > 0
          ? `<span class="flag c-red">${r.pending}</span>`
          : `<span class="flag c-green">0 · ${esc(t("complete"))}</span>`}</td>
      <td class="n" data-label="${esc(t("longestCol"))}">${esc(days(r.longest))}</td>
    </tr>`).join("");
  const longestAll = Math.max(0, ...rows.map(r => r.longest || 0));
  return `
  <div class="sheet">
    <section class="title" aria-labelledby="crc-h">
      <p class="kicker">${esc(t("crcEyebrow"))} · ${esc(SCHOOL.cluster)} · ${esc(t("monthLabel"))}: ${esc(monthName())}</p>
      <h1 id="crc-h">${esc(t("crcHeading"))}</h1>
      <p class="lead">${esc(t("crcFormula"))}</p>
      <div class="stamp stamp--blue" role="note"><span class="stamp__label">${esc(t("privacyStamp"))}</span><p class="stamp__text">${esc(t("crcPrivacy"))}</p></div>
    </section>
    <section class="sec" aria-labelledby="crc-t">
      ${sectionHead("crc-t", t("crcHeading"))}
      <div class="table-wrap">
        <table class="reg stacked" id="crc-table" aria-labelledby="crc-t">
          <thead><tr>

/* ==========================================================================
   7. Dialogs (native <dialog>: focus trap, Esc to close)
   ========================================================================== */
const dlg = $("#dlg");

function openModal(modal, trigger){
  ui.modal = modal;
  if (trigger) ui.returnFocus = trigger.dataset.action;
  renderModal();
  if (!dlg.open) dlg.showModal();
  (dlg.querySelector("[autofocus]") || dlg.querySelector("button, input, select, textarea"))?.focus();
}
function closeModal(){ if (dlg.open) dlg.close(); afterClose(); }
// The native "close" event arrives asynchronously (and also covers Esc), so it must not
// clear a dialog that was opened again in the meantime.
function afterClose(){
  if (dlg.open || !ui.modal) return;
  ui.modal = null;
  dlg.innerHTML = "";
  const target = ui.returnFocus && document.querySelector(`#view [data-action="${ui.returnFocus}"]`);
  (target || $("#main")).focus();
}
dlg.addEventListener("close", afterClose);
dlg.addEventListener("click", e => { if (e.target === dlg) closeModal(); }); // backdrop click

function frame(title, body, foot){
  return `<div class="dlg">
    <div class="dlg__head"><h2 id="dlg-title">${esc(title)}</h2></div>
    <div class="dlg__body">${body}</div>
    <div class="dlg__foot">${foot}</div>
  </div>`;
}
const done = title => "✓ " + title;
const btnClose = (key = "close", primary = false) =>
  `<button type="button" class="btn ${primary ? "btn--primary" : ""}" data-action="close" ${primary ? "autofocus" : ""}>${esc(t(key))}</button>`;
const note = (kind, html) => `<div class="note note--${kind}">${html}</div>`;

function changesTable(before, after, keys){
  const LABEL = { pending:"cardPending", received:"eqReceived", available:"cardBank", noPhysical:"cardGap" };
  return `<table class="changes"><tbody>${keys.map(k => {
    const same = before[k] === after[k];
    return `<tr class="${k === "pending" ? "official" : ""}"><th scope="row">${esc(t(LABEL[k]))}</th>
      <td>${same
        ? `<strong>${after[k]}</strong><span class="same">(${esc(t("unchanged"))})</span>`
        : `<span>${before[k]}</span><span class="arrow" aria-hidden="true">→</span><span class="sr-only"> ${esc(t("becomes"))} </span><strong>${after[k]}</strong>`}</td></tr>`;
  }).join("")}</tbody></table>`;
}

function renderModal(){
  const m = ui.modal;
  const R = { add:modalAdd, give:modalGive, ret:modalReturn, govt:modalGovt, reset:modalReset, group:modalGroup, list:modalList }[m.type];
  dlg.innerHTML = R(m);
}

function modalAdd(m){
  if (m.step === "added") {
    const g = data.groups.find(x => x.id === m.groupId);
    return frame(done(t("addedTitle")),
      note("good", th("addedMsg", { book:groupLabel(g), code:m.code })) + changesTable(m.before, m.after, ["available", "pending"]),
      btnClose("done", true));
  }

  const rows = classesInUse().map(cls => `<div class="bookpick__row">
      <span class="bookpick__cls">${esc(t("classN", { n:cls }))}</span>
      <div class="chips">${sortedGroups().filter(g => g.cls === cls).map(g =>
        `<button type="button" class="chip" data-action="add-to" data-id="${esc(g.id)}" ${g.id === current.id ? "autofocus" : ""}>+ ${esc(subject(g.subjectKey))}</button>`).join("")}</div>
    </div>`).join("");
  return frame(t("addBook"),
    `<p class="q">${esc(t("addWhich"))}</p>

     <p class="hint">${esc(t("addNotListed"))}</p>

}

function modalGive(m){
  const g = currentGroup();
  if (m.step === "done") return frame(done(t("givenTitle")),
    note("good", th("givenMsg", { code:m.code, name:m.name })) +
    note("rule", `<strong>${esc(t("shortageUnchanged", { n:m.after.pending }))}</strong>`) +
    changesTable(m.before, m.after, ["pending", "available", "noPhysical"]),
    btnClose("done", true));
  const shelf = g.copies.filter(c => !c.holder).sort((a, b) => a.code.localeCompare(b.code));
  const waiting = g.students.filter(s => !s.govt && !copyOf(g, s)).sort(byLongestWait);
  const title = `${t("giveBook")} · ${groupLabel(g)}`;
  if (!shelf.length) return frame(title, note("wait", esc(t("noCopies"))), btnClose("close", true));

function modalReturn(m){
  const g = currentGroup();
  if (m.step === "done") return frame(done(t("returnedTitle")),
    note("good", th("returnedMsg", { code:m.code, name:m.name })) +
    (m.stillWaiting ? note("wait", esc(t("stillWaitingNote", { name:m.name }))) : "") +
    changesTable(m.before, m.after, ["pending", "available", "noPhysical"]),
    btnClose("done", true));
  const lent = g.copies.filter(c => c.holder).map(c => ({ c, s:studentById(g, c.holder) }))
    .sort((a, b) => (b.s.govt - a.s.govt) || a.c.code.localeCompare(b.c.code));
  if (!lent.length) return frame(t("returnBook"), note("plain", esc(t("noneIssued"))), btnClose("close", true));

      <span><span class="who">${esc(s.name)}</span><span class="meta"><span class="code">${esc(c.code)}</span>${s.govt ? " · ↩ " + esc(t("returnDueNote")) : ""}</span></span>
      <button type="button" class="btn btn--primary" data-action="return-one" data-code="${esc(c.code)}" ${i === 0 ? "autofocus" : ""}>${esc(t("returnedBtn"))}</button></li>`).join("");
  return frame(t("returnQ"), `<ul class="rows">${rows}</ul>`, btnClose("cancel"));
}

function modalGovt(m){
  const g = currentGroup();
  if (m.step === "done") {
    const recall = m.recall.length
      ? note("wait", `<strong>${esc(t("recallTitle"))}</strong><ul class="namelist">${m.recall.map(r => `<li>${esc(r.name)} — <span class="code">${esc(r.code)}</span></li>`).join("")}</ul>`)

    return frame(done(t("govDoneTitle")),
      changesTable(m.before, m.after, ["pending", "received", "noPhysical", "available"]) +

  }

  if (pending === 0) return frame(title, note("good", esc(t("nonePending"))), btnClose("close", true));
  const waiting = g.students.filter(s => !s.govt).sort(byLongestWait);

     <fieldset><legend class="q">${esc(t("whoGot"))}</legend><p class="hint">${esc(t("whoGotHint"))}</p>

       </label></li>`).join("")}</ul>
     </fieldset>` : "";
  return frame(title,
    `<label class="q" for="qty">${esc(t("govQ"))}</label>
     <p class="hint" id="qty-hint">${esc(t("govHint"))}</p>
     <div class="stepper">
       <button type="button" data-action="qty-minus" aria-label="${esc(t("fewer"))}">−</button>
       <input id="qty" type="number" inputmode="numeric" min="1" max="${pending}" step="1" value="${esc(m.qty)}" aria-describedby="qty-hint qty-err" autofocus>
       <button type="button" data-action="qty-plus" aria-label="${esc(t("more"))}">+</button>

     <p class="hint">${esc(t("pendingBefore", { n:pending }))}</p>
     ${checklist}
     <p class="error" id="qty-err" role="alert">${m.error ? esc(t(m.error.key, m.error.params)) : ""}</p>
     ${note("rule", esc(t("rule")))}`,
    `${btnClose("cancel")}<button type="button" class="btn btn--primary" data-action="govt-confirm">${esc(t("govBtn"))}</button>`);

function modalReset(){

}

/* ==========================================================================
   8. State changes
   ========================================================================== */
function addBook(groupId){
  const g = data.groups.find(x => x.id === groupId);
  if (!g) return;
  prefs.group = g.id; savePrefs();   // show the register the book was added to
  ui.shown = null;
  const before = snapshot(g);
  const code = addCopy(g);
  addLog(g, "added", { code });
  saveData(); render();
  openModal({ type:"add", step:"added", groupId:g.id, code, before, after:snapshot(g) });
  announce(t("addedTitle") + ": " + code);
}

function giveBook(){
  const g = currentGroup();
  const picked = dlg.querySelector("input[name=child]:checked");
  const s = picked && studentById(g, picked.value);
  const copy = g.copies.filter(c => !c.holder).sort((a, b) => a.code.localeCompare(b.code))[0];
  if (!s || s.govt || copyOf(g, s) || !copy) return;
  const before = snapshot(g);
  copy.holder = s.id;                 // Book Bank changes…
  addLog(g, "issued", { code:copy.code, name:s.name });
  saveData(); render();               // …official figures are untouched by design.
  const after = snapshot(g);
  openModal({ type:"give", step:"done", name:s.name, code:copy.code, before, after });
  announce(t("givenTitle") + ". " + t("shortageUnchanged", { n:after.pending }));
}

function returnBook(code){
  const g = currentGroup();
  const copy = g.copies.find(c => c.code === code);
  if (!copy || !copy.holder) return;
  const s = studentById(g, copy.holder);
  const before = snapshot(g);
  copy.holder = null;
  addLog(g, "returned", { code, name:s.name });
  saveData(); render();
  openModal({ type:"ret", step:"done", code, name:s.name, stillWaiting:!s.govt, before, after:snapshot(g) });
  announce(t("returnedTitle"));
}

function tickedIds(){ return [...dlg.querySelectorAll("input[name=got]:checked")].map(i => i.value); }
// Changing the number re-ticks the longest-waiting children, so the usual case needs no extra taps.
function retick(){
  const g = currentGroup();
  const n = parseInt(dlg.querySelector("#qty").value, 10) || 0;
  const order = g.students.filter(s => !s.govt).sort(byLongestWait).map(s => s.id);
  dlg.querySelectorAll("input[name=got]").forEach(box => { box.checked = order.indexOf(box.value) < n; });
  ui.modal.qty = String(dlg.querySelector("#qty").value);
  ui.modal.ticked = null;
}

function recordGovtArrival(){
  const g = currentGroup();
  const pending = officialRowFor(g).pending;
  const input = dlg.querySelector("#qty");
  const n = Number(input.value);
  const ticked = tickedIds();
  let error = null;
  if (!Number.isInteger(n) || n < 1 || n > pending) error = { key:"qtyError", params:{ max:pending } };
  else if (ticked.length > n) error = { key:"tickError", params:{ k:ticked.length, n } };
  if (error) {
    Object.assign(ui.modal, { qty:input.value, ticked, error });
    renderModal();
    dlg.querySelector("#qty").focus();
    return;
  }
  const before = snapshot(g);
  g.govtReceived += n;               // the ONLY place the official shortage goes down
  const handed = ticked.map(id => studentById(g, id));
  handed.forEach(s => { s.govt = true; });
  addLog(g, "govt", { n });
  saveData(); render();
  const recall = handed.filter(s => copyOf(g, s)).map(s => ({ name:s.name, code:copyOf(g, s).code }));
  openModal({ type:"govt", step:"done", before, after:snapshot(g), handed:handed.map(s => s.name), recall });
  announce(t("govDoneTitle") + ". " + t("cardPending") + ": " + officialRowFor(g).pending);
}

function stepQty(delta){
  const pending = officialRowFor(currentGroup()).pending;
  const input = dlg.querySelector("#qty");
  const cur = parseInt(input.value, 10);
  input.value = String(Math.min(pending, Math.max(1, (Number.isFinite(cur) ? cur : 0) + delta)));
  retick();
}

function readInt(id){
  const el = dlg.querySelector("#" + id);
  if (!el || el.value.trim() === "") return null;
  const n = Number(el.value);
  return Number.isInteger(n) && n >= 0 && n <= 2000 ? n : NaN;
}

function saveGroup(){
  const m = ui.modal;
  const entitled = readInt("f-entitled");
  const last = readInt("f-last");
  if (m.mode === "edit") {
    const g = currentGroup();
    m.form = { entitled, lastYearOrder:last };
    if (entitled === null || Number.isNaN(entitled) || Number.isNaN(last) || entitled < g.govtReceived) {
      m.error = { key:"numbersError", params:{} }; renderModal(); return;
    }
    const newPending = entitled - g.govtReceived;
    if (namedWaiting(g) > newPending) { m.error = { key:"entitledTooLow", params:{ n:namedWaiting(g) } }; renderModal(); return; }
    g.entitled = entitled; g.lastYearOrder = last;
    saveData(); closeModal(); render();
    return;
  }
  const cls = dlg.querySelector("#f-class").value, subjectKey = dlg.querySelector("#f-subject").value;
  const received = readInt("f-received") ?? 0;
  m.form = { cls, fixedClass:m.form.fixedClass, subjectKey, entitled, govtReceived:received, lastYearOrder:last };
  if (data.groups.some(g => g.cls === cls && g.subjectKey === subjectKey)) { m.error = { key:"groupExists", params:{} }; renderModal(); return; }
  if (entitled === null || [entitled, received, last].some(Number.isNaN) || received > entitled) {
    m.error = { key:"numbersError", params:{} }; renderModal(); return;
  }
  const g = newGroup(data, { cls, subjectKey, entitled, govtReceived:received, lastYearOrder:last });
  prefs.group = g.id; savePrefs();
  saveData(); ui.shown = null; render();
  openModal({ type:"group", step:"added", groupId:g.id });
  announce(t("groupAdded"));
}

function addToList(){
  const g = currentGroup();
  const m = ui.modal;
  m.names = dlg.querySelector("#names").value;
  m.since = dlg.querySelector("#since").value || sessionStart();
  m.flash = null; m.error = null;
  const seen = new Set(g.students.map(s => s.name.toLocaleLowerCase()));
  const fresh = [], dupes = [];
  for (const raw of m.names.split(/\r?\n/)) {
    const name = raw.trim().replace(/\s+/g, " ").slice(0, MAX_NAME);
    if (!name) continue;
    const key = name.toLocaleLowerCase();
    if (seen.has(key)) dupes.push(name); else { seen.add(key); fresh.push(name); }
  }
  const room = Math.max(0, officialRowFor(g).pending - namedWaiting(g));
  if (!fresh.length) m.error = dupes.length ? { key:"duplicateName", params:{ names:dupes.join(", ") } } : { key:"namesEmpty", params:{} };
  else if (m.since > toISODate(today())) m.error = { key:"sinceFuture", params:{} };
  else if (fresh.length > room) m.error = { key:"tooMany", params:{ n:room } };
  if (m.error) { renderModal(); dlg.querySelector("#names").focus(); return; }
  fresh.forEach(name => addStudent(data, g, name, m.since));
  addLog(g, "listed", { n:fresh.length });
  m.names = "";
  m.flash = t("childrenAdded", { n:fresh.length }) + (dupes.length ? " " + t("duplicateName", { names:dupes.join(", ") }) : "");
  saveData(); render();
  dlg.querySelector("#names").focus();
  announce(m.flash);
}

function removeFromList(id){
  const g = currentGroup();
  const s = studentById(g, id);
  if (!s || copyOf(g, s)) return;
  g.students = g.students.filter(x => x.id !== id);
  saveData(); render();
}

function resetDemo(){
  data = freshData();
  prefs.group = null; savePrefs();
  ui.shown = null;
  saveData(); closeModal(); render();
  announce(t("resetDone"));
}

/* ==========================================================================
   9. Printing — one official statement, one optional paper sheet
   ========================================================================== */
function statementDoc(){
  // Official figures only. No Book Bank field exists in this document.
  const rows = prefs.role === "crc" ? officialRows() : ownRows();
  const body = rows.map(r => `<tr><td>${esc(r.school)}</td><td class="n">${esc(r.cls)}</td><td>${esc(subject(r.subjectKey))}</td>
      <td class="n">${r.entitled}</td><td class="n">${r.received}</td><td class="n"><strong>${r.pending}</strong></td><td class="n">${esc(days(r.longest))}</td></tr>`).join("");
  return `<article class="doc" lang="${prefs.lang}">
    <h1>${esc(t("rpTitle"))}</h1>
    <p class="sub">PASS IT ON</p>
    <div class="meta">
      ${prefs.role === "crc" ? "" : `<span><strong>${esc(t("schoolCol"))}:</strong> ${esc(SCHOOL.name)}</span>`}
      <span><strong>${esc(t("rpBlock"))}:</strong> ${esc(SCHOOL.cluster)}</span>
      <span><strong>${esc(t("monthLabel"))}:</strong> ${esc(monthName())}</span>
    </div>
    <table>
      <thead><tr><th>${esc(t("schoolCol"))}</th><th class="n">${esc(t("classCol"))}</th><th>${esc(t("subjectCol"))}</th><th class="n">${esc(t("entitledCol"))}</th>
        <th class="n">${esc(t("receivedCol"))}</th><th class="n">${esc(t("pendingCol"))}</th><th class="n">${esc(t("longestCol"))}</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <p class="protect">${esc(t("rpImportant"))} ${esc(t("rpNote"))}</p>
    <p><strong>${esc(t("demandHeading"))} (${esc(SCHOOL.name)}):</strong></p>
    <ul>${demandLines().map(d => `<li><strong>${esc(d.label)}:</strong> ${esc(d.text)}</li>`).join("")}</ul>
    <p>${esc(t("crcFormula"))}</p>
    <div class="signs"><div>${esc(t(prefs.role === "crc" ? "rpCrcSign" : "rpSign"))}</div><div>${esc(t("rpDate"))}</div></div>
    <p class="foot-note">${esc(t("rpSource"))} · ${esc(t("printedFrom"))}</p>
  </article>`;
}

function sheetDoc(){
  const blank = Array.from({ length:18 }, () => `<tr class="blank"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join("");
  return `<article class="doc" lang="${prefs.lang}">
    <h1>${esc(t("shTitle"))}</h1>
    <p class="sub">PASS IT ON · ${esc(SCHOOL.name)} · ${esc(t("shSub"))}</p>
    <div class="rules"><strong>${esc(t("shRules"))}</strong>
      <ol><li>${esc(t("shRule1"))}</li><li>${esc(t("shRule2"))}</li><li>${esc(t("shRule3"))}</li></ol>
    </div>
    <table>
      <thead><tr><th style="width:12%">${esc(t("shDate"))}</th><th style="width:15%">${esc(t("shCopy"))}</th><th style="width:8%">${esc(t("classCol"))}</th>
        <th style="width:12%">${esc(t("subjectCol"))}</th><th>${esc(t("shStudent"))}</th><th style="width:14%">${esc(t("shIssRet"))}</th><th style="width:10%">${esc(t("shInit"))}</th></tr></thead>
      <tbody>${blank}</tbody>
    </table>
    <p class="foot-note">${esc(t("papersNote"))}</p>
  </article>`;
}

function printDoc(kind){
  $("#print-root").innerHTML = kind === "sheet" && prefs.role === "school" ? sheetDoc() : statementDoc();
  window.print();
}
// Ctrl+P without a button still prints the official statement, never the app screen.
window.addEventListener("beforeprint", () => { if (!$("#print-root").innerHTML) $("#print-root").innerHTML = statementDoc(); });
window.addEventListener("afterprint", () => { $("#print-root").innerHTML = ""; });

/* ==========================================================================
   10. Events (delegated; no inline handlers)
   ========================================================================== */
function setLang(code){
  if (!I18N[code]) return;
  prefs.lang = code; savePrefs(); render();
}
function openGroupForm(mode, el){
  const g = currentGroup();
  let form;
  if (mode === "edit") form = { entitled:g.entitled, lastYearOrder:g.lastYearOrder };
  else if (el.dataset.scope === "subject") {
    const taken = data.groups.filter(x => x.cls === g.cls).map(x => x.subjectKey);
    form = { cls:g.cls, fixedClass:true, subjectKey:(SUBJECTS.find(s => !taken.includes(s.key)) || SUBJECTS[0]).key, entitled:"", govtReceived:0, lastYearOrder:"" };
  } else {
    const used = classesInUse().map(Number);
    const next = CLASSES.find(c => Number(c) > Math.max(...used)) || CLASSES.find(c => !used.includes(Number(c))) || "1";
    form = { cls:next, subjectKey:"science", entitled:"", govtReceived:0, lastYearOrder:"" };
  }
  openModal({ type:"group", mode, form, error:null }, el);
}
function pickGroup(g, focusSel){
  if (!g) return;
  prefs.group = g.id; savePrefs(); ui.shown = null; render();
  document.querySelector(focusSel)?.focus();
}
const ACTIONS = {
  "set-role":   el => { prefs.role = el.dataset.role; savePrefs(); closeModal(); ui.shown = null; render(); window.scrollTo(0, 0); $("#main").focus({ preventScroll:true }); },
  "open-add":   el => openModal({ type:"add", step:"ask" }, el),
  "open-give":  el => openModal({ type:"give", step:"choose" }, el),
  "open-return":el => openModal({ type:"ret", step:"choose" }, el),
  "open-govt":  el => openModal({ type:"govt", step:"ask", qty:String(officialRowFor(currentGroup()).pending), ticked:null, error:null }, el),
  "open-reset": el => openModal({ type:"reset" }, el),
  "open-group-new":  el => openGroupForm("new", el),
  "open-group-edit": el => openGroupForm("edit", el),
  "open-list":  el => { if (!el.closest("#dlg")) ui.returnFocus = "open-list"; openModal({ type:"list", names:"", since:sessionStart(), flash:null, error:null }); },
  "group-save": () => saveGroup(),
  "list-add":   () => addToList(),
  "list-remove":el => removeFromList(el.dataset.id),
  "add-to":     el => addBook(el.dataset.id),
  "pick-class": el => pickGroup(sortedGroups().find(g => g.cls === el.dataset.cls), `[data-action="pick-class"][data-cls="${el.dataset.cls}"]`),
  "pick-group": el => pickGroup(data.groups.find(g => g.id === el.dataset.id), `[data-action="pick-group"][data-id="${el.dataset.id}"]`),
  "give-confirm": () => giveBook(),
  "return-one": el => returnBook(el.dataset.code),
  "qty-minus":  () => stepQty(-1),
  "qty-plus":   () => stepQty(1),
  "govt-confirm": () => recordGovtArrival(),
  "goto-return": () => { ui.returnFocus = "open-return"; openModal({ type:"ret", step:"choose" }); },
  "reset-confirm": () => resetDemo(),
  "print-statement": () => printDoc("statement"),
  "print-sheet": () => printDoc("sheet"),
  "close":      () => closeModal()
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el, e);
});
document.addEventListener("change", e => {
  if (e.target === langSelect) setLang(langSelect.value);
});
dlg.addEventListener("input", e => { if (e.target.id === "qty") retick(); });
dlg.addEventListener("change", e => { if (e.target.name === "got" && ui.modal) ui.modal.ticked = tickedIds(); });
dlg.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "qty") { e.preventDefault(); recordGovtArrival(); }
});
// Keep two open tabs (or the phone-frame demo) of the prototype in step.
window.addEventListener("storage", e => {
  if (e.key === DATA_KEY || e.key === PREFS_KEY) {
    prefs = loadPrefs();
    const d = store.get(DATA_KEY); data = isValidData(d) ? d : freshData();
    render();
  }
});

render();

<\/script>
</body>
</html>
</script>
<script>
"use strict";
const app = document.getElementById("app");
const phone = document.getElementById("phone");
const stage = document.getElementById("stage");
const size = document.getElementById("size");
const appSource = document.getElementById("app-src").textContent.replace(/<\\\/script/gi, "<" + "/script"); // split so this line cannot close the tag

// Phones overlay their scrollbars, so hide the desktop scrollbar to give the app the true phone width.
const PHONE_STYLE = "<style>html{scrollbar-width:none}html::-webkit-scrollbar{display:none}</style>";
function load(){ app.srcdoc = appSource.replace("</head>", PHONE_STYLE + "</head>"); }
function fit(){
  const [w, h] = size.value.split("x").map(Number);
  const pw = w + 24, ph = h + 60;
  phone.style.width = pw + "px";
  phone.style.height = ph + "px";
  // Scale the whole phone to fit the projector screen.
  const scale = Math.min(1, (window.innerHeight - 110) / ph, (window.innerWidth - 24) / pw);
  phone.style.transform = `scale(${scale})`;
  stage.style.width = pw * scale + "px";
  stage.style.height = ph * scale + "px";
}
size.addEventListener("change", fit);
window.addEventListener("resize", fit);
document.getElementById("reload").addEventListener("click", load);
fit();
load();
</script>
</body>
</html>
