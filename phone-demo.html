<style>
/* Presenter aid: shows the PASS IT ON prototype inside a phone-sized frame for a projector.
   Self-contained — the whole app is embedded below, so this file works on its own, offline. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#20262e;color:#e8e2d4;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:15px}
.bar button,.bar select{font:inherit;background:#2f3844;color:#fff;border:1px solid #56627a;border-radius:6px;padding:7px 12px;cursor:pointer}
.bar button:hover{background:#3a4556}
.stage{position:relative}
.phone{padding:30px 12px;background:#0d1013;border-radius:40px;box-shadow:0 0 0 2px #3b4350,0 30px 80px rgba(0,0,0,.6);transform-origin:top left;position:absolute;top:0;left:0}
.phone::before{content:"";position:absolute;top:12px;left:50%;width:70px;height:6px;margin-left:-35px;background:#2c333d;border-radius:3px}
.screen{width:100%;height:100%;border-radius:22px;overflow:hidden;background:#fff}
iframe{width:100%;height:100%;border:0;display:block}
.hint{font-size:13px;color:#9aa6b8;text-align:center;max-width:560px;padding:0 12px}
</style>
</head>

  <div class="bar">
    <strong>PASS IT ON — phone view</strong>
    <select id="size" aria-label="Phone size">
      <option value="390x844">390 × 844 (typical phone)</option>
      <option value="360x780">360 × 780 (small Android)</option>
      <option value="430x932">430 × 932 (large phone)</option>
    </select>
    <button type="button" id="reload">Reload</button>
  </div>
  <div class="stage" id="stage">
    <div class="phone" id="phone"><div class="screen"><iframe id="app" title="PASS IT ON on a phone"></iframe></div></div>
  </div>
  <p class="hint">Opened from the same folder in the same browser, this shares saved data with pass-it-on.html — keep both open to switch between phone and laptop views.</p>

<!-- The full prototype (pass-it-on.html), embedded so this file never depends on another file. -->
<script type="text/plain" id="app-src"><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="PASS IT ON: an offline school Book Bank prototype that supports the child without hiding the official textbook shortage.">
<title>PASS IT ON</title>
<style>
/* ==========================================================================
   PASS IT ON — single-file offline prototype
   Look: a school register page. Ruled lines, a red margin, ledger figures,
   ink-coloured borders, square corners. No floating cards.
   ========================================================================== */
:root{
  --page:#ebe4d3;
  --sheet:#fffdf7;
  --ink:#1b232c;
  --muted:#515b65;
  --rule:#ddd3bd;
  --rule-strong:#a89c82;
  --head:#f3eee1;
  --blue:#1d3f6e;
  --blue-tint:#e9eff7;
  --red:#a3261d;
  --red-tint:#fcf1ef;
  --green:#245733;
  --green-tint:#eef5ef;
  --amber:#865400;
  --amber-tint:#fdf5e2;
  --margin:#e3a39b;
  --focus:#f0a500;
  --r:4px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,"Noto Sans","Nirmala UI","Noto Sans Devanagari","Noto Sans Oriya","Noto Sans Odia",Mangal,Kalinga,sans-serif;
  font-size:17px;line-height:1.5;
}
html:lang(hi) body,html:lang(mr) body{font-family:"Nirmala UI","Noto Sans Devanagari",Mangal,"Segoe UI",system-ui,sans-serif;line-height:1.65}
html:lang(or) body{font-family:"Nirmala UI","Noto Sans Oriya","Noto Sans Odia",Kalinga,"Segoe UI",system-ui,sans-serif;line-height:1.7}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.3}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--blue);color:#fff;padding:10px 14px;text-decoration:none;font-weight:700}
.skip:focus{top:12px}
.code{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:.92em;white-space:nowrap}
.muted{color:var(--muted)}
.upper{letter-spacing:.06em}
html:lang(en) .upper{text-transform:uppercase;font-size:.86em}

/* ---------- Top bar ---------- */
.topbar{background:var(--sheet);border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:10}
.topbar__inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand__mark{width:34px;height:34px;flex:none}
.brand__name{font-weight:800;letter-spacing:.1em;color:var(--blue);font-size:19px;white-space:nowrap}
.tabs{display:inline-flex;border:1.5px solid var(--blue);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.tabs button{border:0;background:transparent;color:var(--blue);min-height:42px;padding:6px 18px;font-weight:700;font-size:16px;white-space:nowrap}
.tabs button+button{border-left:1.5px solid var(--blue)}
.tabs button:hover{background:var(--blue-tint)}
.tabs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.lang{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.lang select{min-height:44px;min-width:170px;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;padding:6px 10px;font-size:16px;font-weight:600;cursor:pointer}

/* ---------- The register page ---------- */
main{max-width:1100px;margin:22px auto 0;padding:0 16px;outline:none}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--rule-strong);padding:30px 34px 36px 72px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:5px;border-left:1.5px solid var(--margin);border-right:1.5px solid var(--margin)}
.kicker{font-size:15px;font-weight:700;color:var(--muted)}
.title h1{font-size:clamp(26px,3.6vw,38px);color:var(--blue);margin-top:6px;letter-spacing:-.005em}
.title h1 span{display:block}
.title h1 .h1b{color:var(--ink);font-weight:600}
.title .lead{margin-top:8px;color:var(--muted)}
.sec{margin-top:34px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.sec-h h2{font-size:20px}
.sec-h .aside{font-size:15px;font-weight:600}
.aside--local{color:var(--green)}
.aside--official{color:var(--red)}
.aside--wait{color:var(--amber)}
.sec-note{color:var(--muted);font-size:16px;margin:-4px 0 12px}

/* Stamped notice: a printed rule with a label block, like an office stamp */
.stamp{display:flex;align-items:stretch;border:2px solid var(--red);margin-top:18px;background:var(--red-tint)}
.stamp__label{flex:none;display:flex;align-items:center;background:var(--red);color:#fff;font-weight:800;padding:8px 14px;letter-spacing:.06em}
html:lang(en) .stamp__label{text-transform:uppercase;font-size:14px}
.stamp__text{padding:10px 14px;font-weight:650}
.stamp--blue{border-color:var(--blue);background:var(--blue-tint)}
.stamp--blue .stamp__label{background:var(--blue)}

/* ---------- Ledger of today's figures ---------- */
.ledger{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);background:#fff}
.ledger__cell{padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px}
.ledger__cell+.ledger__cell{border-left:1px solid var(--rule-strong)}
.ledger__cell--official{background:var(--red-tint)}
/* The double rule between the official figure and the school-only figures is the point of the page */
.ledger__cell--official+.ledger__cell{border-left:5px double var(--ink)}
.ledger__who{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.mk{width:11px;height:11px;flex:none;display:inline-block}
.ledger__label{font-size:17px;font-weight:700;margin-top:4px}
.ledger__num{font-size:58px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;align-self:flex-start;justify-self:end;padding:0 6px;margin-left:-6px}
.ledger__note{font-size:15px;color:var(--muted);border-top:1px dashed var(--rule-strong);padding-top:6px;margin-top:auto}
.c-red{color:var(--red)} .c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-blue{color:var(--blue)}
.bg-red{background:var(--red)} .bg-green{background:var(--green)} .bg-amber{background:var(--amber)}
.ledger__cell.is-changed .ledger__num{animation:ink 1.6s ease-out}
@keyframes ink{0%{background:#ffe7a3}100%{background:transparent}}

/* ---------- Four primary actions: solid, pressable buttons ---------- */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;background:#fff;border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:0 4px 0 var(--ink);min-height:100px;transition:transform .08s,box-shadow .08s}
.action:hover{background:var(--blue-tint)}
.action:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.action__icon{font-size:28px;line-height:1.2;flex:none}
.action__title{display:block;font-size:19px;font-weight:800;color:var(--blue);line-height:1.3}
.action__sub{display:block;font-size:15px;color:var(--muted);margin-top:3px}
.action--govt{border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.action--govt:hover{background:var(--red-tint)}
.action--govt:active{box-shadow:0 1px 0 var(--red)}
.action--govt .action__title{color:var(--red)}

/* ---------- Two accounts, kept apart ---------- */
.accounts{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);background:#fff}
.account{padding:14px 18px 16px}
.account+.account{border-left:5px double var(--ink)}
.account h3{font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.account h3 small{font-size:14px;font-weight:700}
.leaders{list-style:none;margin:10px 0 0;padding:0}
.leaders li{display:flex;align-items:baseline;gap:8px;padding:6px 0}
.leaders .dots{flex:1 1 24px;min-width:24px;border-bottom:2px dotted var(--rule-strong);transform:translateY(-5px)}
.leaders b{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.leaders .total{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:8px;font-weight:700}
.leaders .total b{border-bottom:4px double currentColor;line-height:1.1}
.foot-note{font-size:15px;color:var(--muted);margin-top:10px}

/* ---------- Register tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
.reg{border:1.5px solid var(--ink);background:#fff}
.reg th,.reg td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:middle}
.reg thead th{background:var(--head);border-bottom:2px solid var(--ink);font-size:15px;font-weight:700}
html:lang(en) .reg thead th{text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.reg .sno{width:52px;color:var(--muted);border-right:1.5px solid var(--margin);text-align:center}
.reg td.n,.reg th.n{text-align:right;font-variant-numeric:tabular-nums}
.reg tfoot th,.reg tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:800;background:var(--head)}
.reg tbody tr:last-child th,.reg tbody tr:last-child td{border-bottom:0}
.st{font-weight:700;display:inline-flex;gap:6px;align-items:baseline}
.st--wait{color:var(--amber)} .st--temp{color:var(--green)} .st--govt{color:var(--blue)} .st--due{color:var(--amber)}
.flag{font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- School-only records ---------- */
.records{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.records h3{font-size:17px;margin-bottom:8px}
.log time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--r);border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:16px;text-align:center}
.btn:hover{background:var(--blue-tint)}
.btn--primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn--primary:hover{background:#15315a}
.btn--danger{background:var(--red);border-color:var(--red);color:#fff}
.btn--danger:hover{background:#86200f}
.btn--link{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn--link:hover{background:transparent;color:var(--ink)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- CRC ---------- */
.demand{display:flex;gap:18px;align-items:center;border:1.5px solid var(--blue);background:var(--blue-tint);padding:14px 18px}
.demand__num{font-size:48px;font-weight:800;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.demand__text{font-size:19px;font-weight:700}

/* ---------- Footer ---------- */
.foot{max-width:1100px;margin:0 auto;padding:12px 16px 28px;color:var(--muted);font-size:15px;display:flex;gap:4px 16px;flex-wrap:wrap;justify-content:space-between}
.foot strong{color:var(--ink)}

/* ---------- Dialog ---------- */
dialog{border:1.5px solid var(--ink);padding:0;border-radius:6px;width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--sheet);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,26,34,.6)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg__head{padding:16px 22px 10px;border-bottom:2px solid var(--ink)}
.dlg__head h2{font-size:22px;color:var(--blue)}
.dlg__body{padding:16px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg__foot{padding:12px 22px 16px;border-top:1px solid var(--rule-strong);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.q{font-size:19px;font-weight:700}
.hint{color:var(--muted);font-size:16px}
.note{border-left:5px solid;padding:9px 12px;font-size:16px}
.note strong{font-weight:750}
.note--good{border-color:var(--green);background:var(--green-tint)}
.note--rule{border-color:var(--red);background:var(--red-tint)}
.note--wait{border-color:var(--amber);background:var(--amber-tint)}
.note--lock{border-color:var(--blue);background:var(--blue-tint)}
.note--plain{border-color:var(--rule-strong);background:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:80px;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;font-size:18px;font-weight:750;padding:12px;box-shadow:0 4px 0 var(--ink)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice--yes{color:var(--green)}
.choice--yes:hover{background:var(--green-tint)}
.choice--no{color:var(--red)}
.choice--no:hover{background:var(--red-tint)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:4px}
.pick{list-style:none;margin:8px 0 0;padding:0;border:1.5px solid var(--ink);background:#fff}
.pick li+li{border-top:1px solid var(--rule)}
.pick label{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;cursor:pointer}
.pick label:hover{background:var(--blue-tint)}
.pick label:has(input:checked){background:var(--blue-tint);box-shadow:inset 5px 0 0 var(--blue)}
.pick input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:0}
.pick .who{font-weight:750;font-size:18px}
.pick .when{margin-left:auto;color:var(--muted);white-space:nowrap}
.rows{list-style:none;margin:0;padding:0;border:1.5px solid var(--ink);background:#fff}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;flex-wrap:wrap}
.rows li+li{border-top:1px solid var(--rule)}
.rows li.due{background:var(--amber-tint);box-shadow:inset 5px 0 0 var(--amber)}
.rows .who{font-weight:750;font-size:18px}
.rows .meta{display:block;font-size:15px;color:var(--muted)}
.rows .btn{margin-left:auto}
.copyline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:1.5px dashed var(--green);background:var(--green-tint);padding:10px 14px;flex-wrap:wrap}
.copyline .code{font-size:20px;font-weight:800;color:var(--green)}
.stepper{display:flex;align-items:stretch;gap:8px;max-width:320px}
.stepper button{width:60px;min-height:60px;font-size:28px;font-weight:800;border-radius:var(--r);border:1.5px solid var(--ink);background:#fff}
.stepper button:hover{background:var(--blue-tint)}
.stepper input{flex:1;min-width:0;text-align:center;font-size:30px;font-weight:800;border:2px solid var(--blue);border-radius:var(--r);background:#fff;font-variant-numeric:tabular-nums}
.error{color:var(--red);font-weight:700}
.changes{width:100%;border:1.5px solid var(--ink);background:#fff}
.changes th,.changes td{padding:9px 12px;border-bottom:1px solid var(--rule);font-size:16px}
.changes tr:last-child th,.changes tr:last-child td{border-bottom:0}
.changes th{font-weight:600;text-align:left}
.changes td{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.changes td strong{font-size:20px}
.changes .official{background:var(--red-tint)}
.changes .official th{color:var(--red);font-weight:700}
.changes .arrow{color:var(--muted);padding:0 4px}
.changes .same{font-size:14px;color:var(--muted);font-style:italic;margin-left:6px}
.namelist{margin:6px 0 0;padding-left:20px}

/* ---------- Print documents (hidden on screen) ---------- */
#print-root{display:none}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .actions{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .ledger{grid-template-columns:1fr}
  .ledger__cell{display:grid;grid-template-columns:1fr auto;grid-template-areas:"who num" "label num" "note note";column-gap:14px;align-items:center}
  .ledger__cell+.ledger__cell{border-left:0;border-top:1px solid var(--rule-strong)}
  .ledger__cell--official+.ledger__cell{border-left:0;border-top:5px double var(--ink)}
  .ledger__who{grid-area:who}
  .ledger__label{grid-area:label}
  .ledger__num{grid-area:num;font-size:48px}
  .ledger__note{grid-area:note;margin-top:6px}
  .accounts{grid-template-columns:1fr}
  .account+.account{border-left:0;border-top:5px double var(--ink)}
  .records{grid-template-columns:1fr}
}
@media (max-width:700px){
  .topbar{position:static}
  .topbar__inner{padding:10px 12px}
  .tabs{width:100%}
  .tabs button{flex:1 1 0;padding:6px 8px}
  .lang{width:100%}
  .lang select{flex:1}
  main{margin-top:12px;padding:0 8px}
  .sheet{padding:20px 14px 26px 36px}
  .sheet::before{left:14px;width:4px}
  .sec{margin-top:28px}
  .foot{padding:12px 12px 24px}
}
@media (max-width:640px){
  .actions{grid-template-columns:1fr}
  .action{min-height:0;flex-direction:row;align-items:center;gap:14px}
  /* Tables become ruled entries so nothing scrolls sideways */
  .stacked thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .stacked,.stacked tbody,.stacked tfoot,.stacked tr,.stacked td,.stacked th{display:block;width:100%}
  .stacked tr{padding:10px 12px;border-bottom:1px solid var(--rule)}
  .stacked tbody tr:last-child{border-bottom:0}
  .stacked td,.stacked th{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;border:0;text-align:right;background:none}
  .stacked td::before,.stacked th::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;font-size:15px}
  .stacked .cell-title{font-size:18px;font-weight:800;text-align:left}
  .stacked .cell-title::before,.stacked .sno::before{content:none}
  .stacked .cell-empty,.stacked .sno{display:none}
  .stacked tfoot tr{background:var(--head);border-top:2px solid var(--ink)}
  .compact tr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .compact th,.compact td{display:block;width:auto;padding:0}
  .compact td::before{content:none}
  .compact .cell-title{font-size:16px}
  .waitlist tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
  .waitlist th,.waitlist td{display:block;width:auto;padding:0;text-align:left}
  .waitlist td::before{content:none}
  .waitlist td.n{text-align:right;color:var(--muted)}
  .waitlist td:last-child{text-align:right}
  .choices{grid-template-columns:1fr}
  .dlg__head,.dlg__body,.dlg__foot{padding-left:16px;padding-right:16px}
  .dlg__foot .btn{flex:1 1 auto}
  .demand{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- Print ---------- */

const localeOf = code => (LANGS.find(l => l.code === code) || LANGS[0]).locale;

/* ==========================================================================
   2. Demo data (illustrative Class 6 Science case from the spec)
   ========================================================================== */
const SCHOOL = Object.freeze({ name:"Govt School A", cls:"6", subjectKey:"science", cluster:"Demo Cluster, Demo Block", codePrefix:"BB-6-SCI-" });
// Other schools' rows exist only as official figures — a CRC never receives Book Bank data from any school.
const OTHER_SCHOOLS = Object.freeze([
  { school:"Govt School B", cls:"6", subjectKey:"science", entitled:42, received:42, longest:0 },
  { school:"Govt School C", cls:"9", subjectKey:"maths",   entitled:47, received:43, longest:18 }
]);
const DATA_KEY = "passiton.v2.data";
const PREFS_KEY = "passiton.v2.prefs";

function freshData(){
  const names = [["Asha",31],["Ravi",26],["Meena",22],["Salim",18],["Pooja",16],["Bikash",14],["Rani",12],["Imran",9],["Sunita",7],["Gopal",5]];
  return {
    v: 2,
    entitled: 60,          // students entitled to a government textbook (actual enrolment)
    govtReceived: 50,      // official government books received — the ONLY thing that closes the shortage
    lastYearOrder: 30,
    students: names.map(([name, days], i) => ({ id:"s" + (i + 1), name, days, govt:false })),
    copies: Array.from({ length:7 }, (_, i) => ({ code: copyCode(i + 1), holder:null })), // school-local Book Bank
    nextCopy: 8,
    log: []
  };
}
function copyCode(n){ return SCHOOL.codePrefix + String(n).padStart(3, "0"); }

/* ==========================================================================
   3. Storage (localStorage, guarded — the app still runs if it is blocked)
   ========================================================================== */
const store = {
  get(key){ try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage blocked: keep working in memory */ } }
};
function isValidData(d){
  return !!d && d.v === 2 && Number.isFinite(d.entitled) && Number.isFinite(d.govtReceived) &&
    Array.isArray(d.students) && Array.isArray(d.copies) && Array.isArray(d.log) && Number.isInteger(d.nextCopy);
}
function loadPrefs(){
  const p = store.get(PREFS_KEY) || {};
  return { lang: I18N[p.lang] ? p.lang : "en", role: p.role === "crc" ? "crc" : "school" };
}
let prefs = loadPrefs();
let data = (() => { const d = store.get(DATA_KEY); return isValidData(d) ? d : freshData(); })();
const savePrefs = () => store.set(PREFS_KEY, prefs);
const saveData = () => store.set(DATA_KEY, data);

/* ==========================================================================
   4. Calculations
   ========================================================================== */

// OFFICIAL figures. Used by the school's official figure, the CRC view and the printed statement.
// Deliberately reads ONLY enrolment, official receipts and waiting days — never data.copies.
function officialSchoolRow(){
  const pending = Math.max(0, data.entitled - data.govtReceived);
  const waitingDays = data.students.filter(s => !s.govt).map(s => s.days);
  return {
    school: SCHOOL.name, cls: SCHOOL.cls, subjectKey: SCHOOL.subjectKey,
    entitled: data.entitled, received: data.govtReceived, pending,
    longest: pending > 0 && waitingDays.length ? Math.max(...waitingDays) : 0
  };
}
function officialRows(){
  return [officialSchoolRow(), ...OTHER_SCHOOLS.map(r => ({ ...r, pending: Math.max(0, r.entitled - r.received) }))];
}

// SCHOOL-LOCAL learning-continuity figures. Never passed to the CRC view or the printed statement.
function studentById(id){ return data.students.find(s => s.id === id); }
function copyOf(student){ return data.copies.find(c => c.holder === student.id) || null; }
function localFigures(){
  const onShelf = data.copies.filter(c => !c.holder);
  const lent = data.copies.filter(c => c.holder);
  // A temporary copy only fills today's gap while the child is still owed their government book.
  const covering = lent.filter(c => !studentById(c.holder).govt).length;
  const pending = officialSchoolRow().pending;
  return {
    available: onShelf.length, lent: lent.length, covering,
    noPhysical: Math.max(0, pending - covering),
    recallDue: lent.filter(c => studentById(c.holder).govt)
  };
}
function snapshot(){
  const o = officialSchoolRow(), l = localFigures();
  return { pending:o.pending, received:o.received, available:l.available, noPhysical:l.noPhysical };
}
const byLongestWait = (a, b) => b.days - a.days || a.name.localeCompare(b.name);

/* ==========================================================================
   5. Helpers
   ========================================================================== */
const $ = sel => document.querySelector(sel);
const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = v => String(v).replace(/[&<>"']/g, ch => ESC[ch]);
function fill(str, params){ return str.replace(/\{(\w+)\}/g, (m, k) => (params && k in params) ? params[k] : m); }
function t(key, params){ return fill((I18N[prefs.lang] && I18N[prefs.lang][key]) ?? I18N.en[key] ?? key, params); }
/* HTML-safe translation; parameters are escaped and emphasised. */
function th(key, params){
  const safe = {};
  for (const k in (params || {})) safe[k] = "\u0000" + k + "\u0001";
  let out = esc(t(key, safe));
  for (const k in (params || {})) out = out.split("\u0000" + k + "\u0001").join("<strong>" + esc(params[k]) + "</strong>");
  return out;
}
const days = n => t("days", { n });
const subject = key => t(key);
function monthName(){
  try { return new Intl.DateTimeFormat(localeOf(prefs.lang), { month:"long", year:"numeric" }).format(new Date()); }
  catch { return new Intl.DateTimeFormat("en-IN", { month:"long", year:"numeric" }).format(new Date()); }
}
function timeLabel(iso){
  try { return new Intl.DateTimeFormat(localeOf(prefs.lang), { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }).format(new Date(iso)); }
  catch { return ""; }
}
function announce(msg){ const live = $("#live"); live.textContent = ""; setTimeout(() => { live.textContent = msg; }, 30); }
function addLog(k, p){ data.log.unshift({ k, p, at:new Date().toISOString() }); data.log.length = Math.min(data.log.length, 40); }

   6. Rendering
   ========================================================================== */
const ui = { modal:null, returnFocus:null, shown:null };
const langSelect = $("#lang-select");
langSelect.innerHTML = LANGS.map(l => `<option value="${esc(l.code)}" lang="${esc(l.code)}">${esc(l.name)}</option>`).join("");

function render(){
  document.documentElement.lang = prefs.lang;
  document.title = "PASS IT ON · " + (prefs.role === "crc" ? t("crcHeading") : t("school"));
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-action=set-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === prefs.role)));
  langSelect.value = prefs.lang;
  // Only the active view exists in the DOM, so the CRC page never even contains hidden Book Bank data.
  $("#view").innerHTML = prefs.role === "crc" ? crcView() : schoolView();
  if (prefs.role === "school") markChangedFigures();
  if (ui.modal) renderModal();
}

function markChangedFigures(){
  const now = snapshot();
  if (ui.shown) {
    ["pending", "available", "noPhysical"].forEach(key => {
      if (ui.shown[key] !== now[key]) document.querySelector(`[data-stat="${key}"]`)?.classList.add("is-changed");
    });
  }
  ui.shown = now;
}

/* ==========================================================================
   7. Dialogs (native <dialog>: focus trap, Esc to close)

const dlg = $("#dlg");

function openModal(modal, trigger){
  ui.modal = modal;
  if (trigger) ui.returnFocus = trigger.dataset.action;
  renderModal();
  if (!dlg.open) dlg.showModal();
  (dlg.querySelector("[autofocus]") || dlg.querySelector("button, input"))?.focus();
}
function closeModal(){ if (dlg.open) dlg.close(); afterClose(); }
// The native "close" event arrives asynchronously (and also covers Esc), so it must not
// clear a dialog that was opened again in the meantime.
function afterClose(){
  if (dlg.open || !ui.modal) return;
  ui.modal = null;
  dlg.innerHTML = "";
  const target = ui.returnFocus && document.querySelector(`#view [data-action="${ui.returnFocus}"]`);
  (target || $("#main")).focus();
}
dlg.addEventListener("close", afterClose);
dlg.addEventListener("click", e => { if (e.target === dlg) closeModal(); }); // backdrop click

function frame(title, body, foot){
  return `<div class="dlg">
    <div class="dlg__head"><h2 id="dlg-title">${esc(title)}</h2></div>
    <div class="dlg__body">${body}</div>
    <div class="dlg__foot">${foot}</div>
  </div>`;
}
const done = title => "✓ " + title;
const btnClose = (key = "close", primary = false) =>
  `<button type="button" class="btn ${primary ? "btn--primary" : ""}" data-action="close" ${primary ? "autofocus" : ""}>${esc(t(key))}</button>`;
const note = (kind, html) => `<div class="note note--${kind}">${html}</div>`;

function changesTable(before, after, keys){
  const LABEL = { pending:"cardPending", received:"eqReceived", available:"cardBank", noPhysical:"cardGap" };
  return `<table class="changes"><tbody>${keys.map(k => {
    const same = before[k] === after[k];
    return `<tr class="${k === "pending" ? "official" : ""}"><th scope="row">${esc(t(LABEL[k]))}</th>
      <td>${same
        ? `<strong>${after[k]}</strong><span class="same">(${esc(t("unchanged"))})</span>`
        : `<span>${before[k]}</span><span class="arrow" aria-hidden="true">→</span><span class="sr-only"> ${esc(t("becomes"))} </span><strong>${after[k]}</strong>`}</td></tr>`;
  }).join("")}</tbody></table>`;
}

function renderModal(){
  const m = ui.modal;
  const R = { add:modalAdd, give:modalGive, ret:modalReturn, govt:modalGovt, reset:modalReset }[m.type];
  dlg.innerHTML = R(m);
}

function modalAdd(m){
  if (m.step === "added") return frame(done(t("addedTitle")),
    note("good", th("addedMsg", { code:m.code })) + changesTable(m.before, m.after, ["available", "pending"]),
    btnClose("done", true));
  if (m.step === "rejected") return frame(t("rejectedTitle"),
    note("rule", esc(t("rejectedMsg"))) + changesTable(m.before, m.after, ["available"]),
    btnClose("done", true));
  return frame(t("addBook"),
    `<p class="q" id="add-q">${esc(t("addQ"))}</p>
     <p class="hint">${esc(t("addHint"))}</p>
     <div class="choices" role="group" aria-labelledby="add-q">
       <button type="button" class="choice choice--yes" data-action="add-yes" autofocus>✓ ${esc(t("yesCurrent"))}</button>
       <button type="button" class="choice choice--no" data-action="add-no">✗ ${esc(t("noOld"))}</button>
     </div>
     ${note("plain", esc(t("voluntary")))}`,
    btnClose("cancel"));
}

function modalGive(m){
  if (m.step === "done") return frame(done(t("givenTitle")),
    note("good", th("givenMsg", { code:m.code, name:m.name })) +
    note("rule", `<strong>${esc(t("shortageUnchanged", { n:m.after.pending }))}</strong>`) +
    changesTable(m.before, m.after, ["pending", "available", "noPhysical"]),
    btnClose("done", true));
  const shelf = data.copies.filter(c => !c.holder).sort((a, b) => a.code.localeCompare(b.code));
  const waiting = data.students.filter(s => !s.govt && !copyOf(s)).sort(byLongestWait);
  if (!shelf.length) return frame(t("giveBook"), note("wait", esc(t("noCopies"))), btnClose("close", true));
  if (!waiting.length) return frame(t("giveBook"), note("good", esc(t("noWaiting"))), btnClose("close", true));
  const options = waiting.map((s, i) => `<li><label>
      <input type="radio" name="child" value="${esc(s.id)}" ${i === 0 ? "checked autofocus" : ""}>
      <span class="who">${esc(s.name)}</span><span class="when">${esc(days(s.days))}</span></label></li>`).join("");
  return frame(t("giveBook"),
    `<fieldset><legend class="q">${esc(t("giveQ"))}</legend><p class="hint">${esc(t("giveHint"))}</p><ul class="pick">${options}</ul></fieldset>
     <div class="copyline"><span>${esc(t("copyToGive"))}</span><span class="code">${esc(shelf[0].code)}</span></div>
     ${note("rule", esc(t("willStay", { n:officialSchoolRow().pending })))}`,
    `${btnClose("cancel")}<button type="button" class="btn btn--primary" data-action="give-confirm">${esc(t("giveBtn"))}</button>`);
}

function modalReturn(m){
  if (m.step === "done") return frame(done(t("returnedTitle")),
    note("good", th("returnedMsg", { code:m.code, name:m.name })) +
    (m.stillWaiting ? note("wait", esc(t("stillWaitingNote", { name:m.name }))) : "") +
    changesTable(m.before, m.after, ["pending", "available", "noPhysical"]),
    btnClose("done", true));
  const lent = data.copies.filter(c => c.holder).map(c => ({ c, s:studentById(c.holder) }))
    .sort((a, b) => (b.s.govt - a.s.govt) || a.c.code.localeCompare(b.c.code));
  if (!lent.length) return frame(t("returnBook"), note("plain", esc(t("noneIssued"))), btnClose("close", true));
  const rows = lent.map(({ c, s }, i) => `<li class="${s.govt ? "due" : ""}">
      <span><span class="who">${esc(s.name)}</span><span class="meta"><span class="code">${esc(c.code)}</span>${s.govt ? " · ↩ " + esc(t("returnDueNote")) : ""}</span></span>
      <button type="button" class="btn btn--primary" data-action="return-one" data-code="${esc(c.code)}" ${i === 0 ? "autofocus" : ""}>${esc(t("returnedBtn"))}</button></li>`).join("");
  return frame(t("returnQ"), `<ul class="rows">${rows}</ul>`, btnClose("cancel"));
}

function modalGovt(m){
  if (m.step === "done") {
    const recall = m.recall.length
      ? note("wait", `<strong>${esc(t("recallTitle"))}</strong><ul class="namelist">${m.recall.map(r => `<li>${esc(r.name)} — <span class="code">${esc(r.code)}</span></li>`).join("")}</ul>`)
      : "";
    return frame(done(t("govDoneTitle")),
      changesTable(m.before, m.after, ["pending", "received", "noPhysical", "available"]) +
      note("plain", `${esc(t("handOut"))} <strong>${m.handed.map(esc).join(", ")}</strong>`) +
      recall + note("lock", esc(t("bankSeparate"))),
      (m.recall.length ? `<button type="button" class="btn" data-action="goto-return">${esc(t("openReturn"))}</button>` : "") + btnClose("done", true));
  }
  const pending = officialSchoolRow().pending;
  if (pending === 0) return frame(t("govArrived"), note("good", esc(t("nonePending"))), btnClose("close", true));
  return frame(t("govArrived"),
    `<label class="q" for="qty">${esc(t("govQ"))}</label>
     <p class="hint" id="qty-hint">${esc(t("govHint"))}</p>
     <div class="stepper">
       <button type="button" data-action="qty-minus" aria-label="${esc(t("fewer"))}">−</button>
       <input id="qty" type="number" inputmode="numeric" min="1" max="${pending}" step="1" value="${m.qty}" aria-describedby="qty-hint qty-err" autofocus>
       <button type="button" data-action="qty-plus" aria-label="${esc(t("more"))}">+</button>
     </div>
     <p class="hint">${esc(t("pendingBefore", { n:pending }))}</p>
     <p class="error" id="qty-err" role="alert">${m.error ? esc(t("qtyError", { max:pending })) : ""}</p>
     ${note("rule", esc(t("rule")))}`,
    `${btnClose("cancel")}<button type="button" class="btn btn--primary" data-action="govt-confirm">${esc(t("govBtn"))}</button>`);
}

function modalReset(){
  return frame(t("resetQ"), `<p>${esc(t("resetMsg"))}</p>`,
    `${btnClose("cancel")}<button type="button" class="btn btn--danger" data-action="reset-confirm" autofocus>${esc(t("resetYes"))}</button>`);
}

/* ==========================================================================
   8. State changes
   ========================================================================== */
function addBook(isCurrent){
  const before = snapshot();
  if (!isCurrent) {
    addLog("rejected", {});
    saveData(); render();
    openModal({ type:"add", step:"rejected", before, after:snapshot() });
    announce(t("rejectedTitle"));
    return;
  }
  const code = copyCode(data.nextCopy++);
  data.copies.push({ code, holder:null });
  addLog("added", { code });
  saveData(); render();
  openModal({ type:"add", step:"added", code, before, after:snapshot() });
  announce(t("addedTitle") + ": " + code);
}

function giveBook(){
  const picked = dlg.querySelector("input[name=child]:checked");
  const s = picked && studentById(picked.value);
  const copy = data.copies.filter(c => !c.holder).sort((a, b) => a.code.localeCompare(b.code))[0];
  if (!s || s.govt || copyOf(s) || !copy) return;
  const before = snapshot();
  copy.holder = s.id;                 // Book Bank changes…
  addLog("issued", { code:copy.code, name:s.name });
  saveData(); render();               // …official figures are untouched by design.
  const after = snapshot();
  openModal({ type:"give", step:"done", name:s.name, code:copy.code, before, after });
  announce(t("givenTitle") + ". " + t("shortageUnchanged", { n:after.pending }));
}

function returnBook(code){
  const copy = data.copies.find(c => c.code === code);
  if (!copy || !copy.holder) return;
  const s = studentById(copy.holder);
  const before = snapshot();
  copy.holder = null;
  addLog("returned", { code, name:s.name });
  saveData(); render();
  openModal({ type:"ret", step:"done", code, name:s.name, stillWaiting:!s.govt, before, after:snapshot() });
  announce(t("returnedTitle"));
}

function recordGovtArrival(){
  const pending = officialSchoolRow().pending;
  const input = dlg.querySelector("#qty");
  const n = Number(input.value);
  if (!Number.isInteger(n) || n < 1 || n > pending) {
    ui.modal.qty = input.value; ui.modal.error = true; renderModal();
    dlg.querySelector("#qty").focus();
    return;
  }
  const before = snapshot();
  data.govtReceived += n;
  // Official books go to the longest-waiting children first — a temporary copy never lowers a child's priority.
  const handed = data.students.filter(s => !s.govt).sort(byLongestWait).slice(0, n);
  handed.forEach(s => { s.govt = true; });
  addLog("govt", { n });
  saveData(); render();
  const recall = handed.map(s => ({ name:s.name, copy:copyOf(s) })).filter(r => r.copy).map(r => ({ name:r.name, code:r.copy.code }));
  openModal({ type:"govt", step:"done", before, after:snapshot(), handed:handed.map(s => s.name), recall });
  announce(t("govDoneTitle") + ". " + t("cardPending") + ": " + officialSchoolRow().pending);
}

function stepQty(delta){
  const pending = officialSchoolRow().pending;
  const input = dlg.querySelector("#qty");
  const cur = parseInt(input.value, 10);
  input.value = String(Math.min(pending, Math.max(1, (Number.isFinite(cur) ? cur : 0) + delta)));
  ui.modal.qty = input.value;
}

function resetDemo(){
  data = freshData();
  ui.shown = null;
  saveData(); closeModal(); render();
  announce(t("resetDone"));
}

/* ==========================================================================
   9. Printing — one official statement, one optional paper sheet
   ========================================================================== */
function statementDoc(){
  // Official figures only. No Book Bank field exists in this document.
  const rows = prefs.role === "crc" ? officialRows() : [officialSchoolRow()];
  const own = officialSchoolRow();
  const body = rows.map(r => `<tr><td>${esc(r.school)}</td><td class="n">${esc(r.cls)}</td><td>${esc(subject(r.subjectKey))}</td>
      <td class="n">${r.entitled}</td><td class="n">${r.received}</td><td class="n"><strong>${r.pending}</strong></td><td class="n">${esc(days(r.longest))}</td></tr>`).join("");
  return `<article class="doc" lang="${prefs.lang}">
    <h1>${esc(t("rpTitle"))}</h1>
    <p class="sub">PASS IT ON</p>
    <div class="meta">
      ${prefs.role === "crc" ? "" : `<span><strong>${esc(t("schoolCol"))}:</strong> ${esc(SCHOOL.name)}</span>`}
      <span><strong>${esc(t("rpBlock"))}:</strong> ${esc(SCHOOL.cluster)}</span>
      <span><strong>${esc(t("monthLabel"))}:</strong> ${esc(monthName())}</span>
    </div>
    <table>
      <thead><tr><th>${esc(t("schoolCol"))}</th><th class="n">${esc(t("classCol"))}</th><th>${esc(t("subjectCol"))}</th><th class="n">${esc(t("entitledCol"))}</th>
        <th class="n">${esc(t("receivedCol"))}</th><th class="n">${esc(t("pendingCol"))}</th><th class="n">${esc(t("longestCol"))}</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <p class="protect">${esc(t("rpImportant"))} ${esc(t("rpNote"))}</p>
    <p><strong>${esc(t("demandHeading"))}:</strong> ${esc(t("demandText", { n:own.entitled, old:data.lastYearOrder }))} (${esc(own.school)}, ${esc(t("classN", { n:own.cls }))} ${esc(subject(own.subjectKey))})</p>
    <p>${esc(t("crcFormula"))}</p>
    <div class="signs"><div>${esc(t(prefs.role === "crc" ? "rpCrcSign" : "rpSign"))}</div><div>${esc(t("rpDate"))}</div></div>
    <p class="foot-note">${esc(t("rpSource"))} · ${esc(t("printedFrom"))}</p>
  </article>`;
}

function sheetDoc(){
  const blank = Array.from({ length:18 }, () => `<tr class="blank"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join("");
  return `<article class="doc" lang="${prefs.lang}">
    <h1>${esc(t("shTitle"))}</h1>
    <p class="sub">PASS IT ON · ${esc(SCHOOL.name)} · ${esc(t("shSub"))}</p>
    <div class="rules"><strong>${esc(t("shRules"))}</strong>
      <ol><li>${esc(t("shRule1"))}</li><li>${esc(t("shRule2"))}</li><li>${esc(t("shRule3"))}</li></ol>
    </div>
    <table>
      <thead><tr><th style="width:12%">${esc(t("shDate"))}</th><th style="width:15%">${esc(t("shCopy"))}</th><th style="width:8%">${esc(t("classCol"))}</th>
        <th style="width:12%">${esc(t("subjectCol"))}</th><th>${esc(t("shStudent"))}</th><th style="width:14%">${esc(t("shIssRet"))}</th><th style="width:10%">${esc(t("shInit"))}</th></tr></thead>
      <tbody>${blank}</tbody>
    </table>
    <p class="foot-note">${esc(t("papersNote"))}</p>
  </article>`;
}

function printDoc(kind){
  $("#print-root").innerHTML = kind === "sheet" && prefs.role === "school" ? sheetDoc() : statementDoc();
  window.print();
}
// Ctrl+P without a button still prints the official statement, never the app screen.
window.addEventListener("beforeprint", () => { if (!$("#print-root").innerHTML) $("#print-root").innerHTML = statementDoc(); });
window.addEventListener("afterprint", () => { $("#print-root").innerHTML = ""; });

/* ==========================================================================
   10. Events (delegated; no inline handlers)
   ========================================================================== */
function setLang(code){
  if (!I18N[code]) return;
  prefs.lang = code; savePrefs(); render();
}
const ACTIONS = {
  "set-role":   el => { prefs.role = el.dataset.role; savePrefs(); closeModal(); ui.shown = null; render(); window.scrollTo(0, 0); $("#main").focus({ preventScroll:true }); },
  "open-add":   el => openModal({ type:"add", step:"ask" }, el),
  "open-give":  el => openModal({ type:"give", step:"choose" }, el),
  "open-return":el => openModal({ type:"ret", step:"choose" }, el),
  "open-govt":  el => openModal({ type:"govt", step:"ask", qty:officialSchoolRow().pending, error:false }, el),
  "open-reset": el => openModal({ type:"reset" }, el),
  "add-yes":    () => addBook(true),
  "add-no":     () => addBook(false),
  "give-confirm": () => giveBook(),
  "return-one": el => returnBook(el.dataset.code),
  "qty-minus":  () => stepQty(-1),
  "qty-plus":   () => stepQty(1),
  "govt-confirm": () => recordGovtArrival(),
  "goto-return": () => { ui.returnFocus = "open-return"; openModal({ type:"ret", step:"choose" }); },
  "reset-confirm": () => resetDemo(),
  "print-statement": () => printDoc("statement"),
  "print-sheet": () => printDoc("sheet"),
  "close":      () => closeModal()
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el, e);
});
langSelect.addEventListener("change", () => setLang(langSelect.value));
dlg.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "qty") { e.preventDefault(); recordGovtArrival(); }
});
// Keep two open tabs (or the phone-frame demo) of the prototype in step.
window.addEventListener("storage", e => {
  if (e.key === DATA_KEY || e.key === PREFS_KEY) {
    prefs = loadPrefs();
    const d = store.get(DATA_KEY); data = isValidData(d) ? d : freshData();
    render();
  }
});

render();
<\/script>
</body>
</html>
</script>
<script>
"use strict";
const app = document.getElementById("app");
const phone = document.getElementById("phone");
const stage = document.getElementById("stage");
const size = document.getElementById("size");
const appSource = document.getElementById("app-src").textContent.replace(/<\\\/script/gi, "<" + "/script"); // split so this line cannot close the tag

// Phones overlay their scrollbars, so hide the desktop scrollbar to give the app the true phone width.
const PHONE_STYLE = "<style>html{scrollbar-width:none}html::-webkit-scrollbar{display:none}</style>";
function load(){ app.srcdoc = appSource.replace("</head>", PHONE_STYLE + "</head>"); }
function fit(){
  const [w, h] = size.value.split("x").map(Number);
  const pw = w + 24, ph = h + 60;
  phone.style.width = pw + "px";
  phone.style.height = ph + "px";
  // Scale the whole phone to fit the projector screen.
  const scale = Math.min(1, (window.innerHeight - 110) / ph, (window.innerWidth - 24) / pw);
  phone.style.transform = `scale(${scale})`;
  stage.style.width = pw * scale + "px";
  stage.style.height = ph * scale + "px";
}
size.addEventListener("change", fit);
window.addEventListener("resize", fit);
document.getElementById("reload").addEventListener("click", load);
fit();
load();
</script>
</body>
</html>
